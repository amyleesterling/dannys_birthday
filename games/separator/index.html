  html, body {

  #hint {

  .gamebar {
    flex: 0 0 auto;

  @media (max-width: 820px) {

    .gamebar-title { display: none; }
    .gamebar-name { font-size: 17px; }
    .gamebar-pat { font-size: 14px; }
    .gamebar-back { padding: 8px 10px; font-size: 12px; }

<body>
<header class="gamebar holopanel" style="--bar-accent: 255 182 72;">
  <a class="gamebar-back" href="../../">ALL GAMES</a>
  <span class="gamebar-name">SEPARATOR</span>
  <a class="gamebar-pat" href="https://patents.google.com/patent/US9480991B2/en" target="_blank" rel="noopener">US 9,480,991 B2</a>
  <span class="gamebar-title">Radiofrequency particle separator</span>
  <button type="button" data-key="r">RESTART</button>
  <button type="button" data-key="m" id="sndbtn">SOUND ON</button>
</header>
<div class="stage"><canvas id="c"></canvas></div>
<script>
// The bar talks to the game the same way a keyboard does, so the game needs no
// hook of its own and the two stay independent.
document.querySelectorAll('.gamebar button').forEach(b => {
  b.addEventListener('click', () => {
    window.dispatchEvent(new KeyboardEvent('keydown', { key: b.dataset.key }));
    if (b.id === 'sndbtn') {
      b.dataset.off = b.dataset.off ? '' : '1';
      b.textContent = b.dataset.off ? 'SOUND OFF' : 'SOUND ON';
    }
    b.blur();
  });
});
</script>

<script>
(() => {
'use strict';

const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);

const COL = {
  bg:     '#07090a',
  panel:  '#0d1112',
  rule:   '#1e2826',
  text:   '#e2e6e4',
  dim:    '#7f918b',
  faint:  '#4e5a55',
  amber:  '#ffb648',
  hot:    '#ff7a3c',
  teal:   '#35e0d0',
  red:    '#ff4d5e',
  fluid:  '#101c1d',
  fluid2: '#0a1314',
};

// ---------------------------------------------------------------------------
// Minerals.
//
// The patent turns on skin depth. Skin depth falls with the square root of
// frequency, and separation works best when it lands at about a tenth of the
// particle diameter, so a larger particle tunes lower. Every number below is
// derived from the diameter by ONE formula, so the size you see on screen, the
// band on the dial and the figure in the assay table can never disagree.
//
// The constant is invented. The relation is the patent's.
const TUNE_K = 46;                                   // MHz mm squared
const optimalMHz = d => TUNE_K / (d * d);

const MINERAL = {
  gold:     { name: 'GOLD',      d: 1.60, color: '#ffc74a', loss: 1.00, value: 260, target: true },
  silver:   { name: 'SILVER',    d: 1.10, color: '#dfe7ee', loss: 0.94, value: 180, target: true },
  copper:   { name: 'COPPER',    d: 0.80, color: '#e2793f', loss: 0.88, value: 140, target: true },
  platinum: { name: 'PLATINUM',  d: 0.55, color: '#b9c6d6', loss: 0.80, value: 330, target: true },
  quartz:   { name: 'QUARTZ',    d: 0,    color: '#79867f', loss: 0.34, value: 0,   target: false },
  shale:    { name: 'SHALE',     d: 0,    color: '#4d5a56', loss: 0.30, value: 0,   target: false },
};
const TARGETS = ['gold', 'silver', 'copper', 'platinum'];

// selectivity: the response band is a fraction of the centre frequency
const BAND_FRAC  = 0.085;
const BOOST_BAND = 2.3;

const F_MIN = 8, F_MAX = 320;

// ---------------------------------------------------------------------------

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });

let W = 0, H = 0, dpr = 1, L = {};
let state = 'title';
let batch = 1, score = 0, strikes = 0;
let power = 100, freq = 46, boost = false;

let parts = [], fx = [], bubbles = [];
let feedPlan = [], spawnT = 0, spawned = 0;
let stat = null;
let shake = 0;

const pointer = { x: 0, y: 0, down: false, inside: false };
const keys = {};

const MAX_STRIKES = 3;

// ---------------------------------------------------------------- audio

const audio = {
  ctx: null, muted: false, hum: null, humGain: null,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.hum = this.ctx.createOscillator();
    this.humGain = this.ctx.createGain();
    this.hum.type = 'sawtooth';
    this.hum.frequency.value = 80;
    this.humGain.gain.value = 0;
    this.hum.connect(this.humGain).connect(this.ctx.destination);
    this.hum.start();
  },
  setHum(f, g) {
    if (!this.ctx || !this.hum) return;
    const t = this.ctx.currentTime;
    this.hum.frequency.setTargetAtTime(f, t, 0.05);
    this.humGain.gain.setTargetAtTime(this.muted ? 0 : g, t, 0.08);
  },
  tone(f1, f2, dur, type, gain) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f1, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(30, f2), t + dur);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(this.ctx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  },
  lift()  { this.tone(300, 900, 0.10, 'sine', 0.035); },
  good()  { this.tone(700, 1500, 0.10, 'sine', 0.05); },
  bad()   { this.tone(260, 110, 0.22, 'square', 0.05); },
  batchOk(){ this.tone(400, 1300, 0.4, 'triangle', 0.05); },
  fail()  { this.tone(300, 60, 0.7, 'sawtooth', 0.06); },
};

// ---------------------------------------------------------------- layout

function layout() {
  const rect = canvas.getBoundingClientRect();
  dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.height * dpr);
  W = rect.width; H = rect.height;

  const wide = W >= 1120;
  const padL = wide ? 208 : 168;
  const padR = wide ? 244 : 186;
  L = {
    left:  { x: 0, w: padL },
    right: { x: W - padR, w: padR },
    ch:    { x: padL, y: 0, w: W - padL - padR, h: H },
    hud:   H < 660 ? 0.9 : 1,
  };
  L.ch.cx = L.ch.x + L.ch.w / 2;

  L.dialH = 62;
  L.dial = { x: L.ch.x + 16, y: L.ch.h - L.dialH - 10, w: L.ch.w - 32, h: L.dialH };
  L.surfaceY = L.ch.h * 0.19;
  L.bedY = L.dial.y - 22;
  L.zone = { x: L.ch.x + L.ch.w * 0.32, w: L.ch.w * 0.30 };
  L.skim = L.ch.x + L.ch.w * 0.80;
}

// spectrum is logarithmic, so the low bands are not crushed into the left edge
const fToX = f => L.dial.x + (Math.log(clamp(f, F_MIN, F_MAX)) - Math.log(F_MIN)) /
                  (Math.log(F_MAX) - Math.log(F_MIN)) * L.dial.w;
const xToF = x => Math.exp(Math.log(F_MIN) +
                  clamp((x - L.dial.x) / L.dial.w, 0, 1) * (Math.log(F_MAX) - Math.log(F_MIN)));

// ---------------------------------------------------------------- feed

function buildBatch(n) {
  // early batches run one target at a time, later ones interleave
  const kinds = Math.min(TARGETS.length, 1 + Math.floor(n / 2));
  const usable = TARGETS.slice(0, kinds);
  const runLen = Math.max(3, 9 - n);
  const total = 26 + n * 4;
  const plan = [];
  let i = 0;
  while (plan.length < total) {
    const k = usable[i % usable.length];
    const run = Math.round(runLen * rand(0.7, 1.3));
    for (let j = 0; j < run && plan.length < total; j++) {
      plan.push(k);
      // waste rides along with the ore, and its size overlaps the ore
      if (Math.random() < 0.42 + n * 0.03) plan.push(Math.random() < 0.6 ? 'quartz' : 'shale');
    }
    i++;
  }
  return plan;
}

function startBatch(n) {
  feedPlan = buildBatch(n);
  spawned = 0; spawnT = 0;
  parts = []; fx = []; bubbles = [];
  power = 100;
  stat = { fed: 0, targets: 0, recovered: 0, waste: 0, tails: 0, gross: 0 };
}

function spawnOne() {
  const kind = feedPlan[spawned++];
  const m = MINERAL[kind];
  // waste has no fixed size, and it deliberately overlaps the ore sizes
  const d = m.target ? m.d * rand(0.94, 1.06) : rand(0.5, 1.75);
  const r = 4 + d * 7.2;
  const p = {
    kind, m, d, r,
    x: L.ch.x - 24,
    y: rand(L.surfaceY + r + 26, L.bedY - r - 6),
    vx: 0, vy: rand(4, 12),
    heat: 0, lifted: false, done: false,
    ph: rand(0, TAU),
    shape: Array.from({ length: 7 }, () => rand(0.72, 1.24)),
  };
  parts.push(p);
  stat.fed++;
  if (m.target) stat.targets++;
  return p;
}

// coupling of a particle to the current field, from its own diameter
function response(p) {
  const fc = optimalMHz(p.d);
  const half = fc * BAND_FRAC * (boost ? BOOST_BAND : 1);
  const dev = (freq - fc) / half;
  return Math.exp(-dev * dev) * p.m.loss;
}

// ---------------------------------------------------------------- run

function startRun() {
  layout();
  batch = 1; score = 0; strikes = 0; freq = 46;
  startBatch(batch);
  state = 'play';
}

function endBatch() {
  const recovery = stat.targets ? stat.recovered / stat.targets : 0;
  const collected = stat.recovered + stat.waste;
  const grade = collected ? stat.recovered / collected : 0;
  const pass = recovery >= 0.55 && grade >= 0.70;
  if (pass) {
    score += Math.round(stat.gross * (0.5 + grade));
    audio.batchOk();
  } else {
    strikes++;
    audio.fail();
  }
  stat.report = { recovery, grade, pass };
  state = 'report';
  if (strikes >= MAX_STRIKES) state = 'over';
}

// ---------------------------------------------------------------- input

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  move(e);
  audio.init();
  pointer.down = true;
  if (state === 'title' || state === 'over') { startRun(); return; }
  if (state === 'report') { batch++; startBatch(batch); state = 'play'; return; }
  tuneFromPointer();
});
canvas.addEventListener('pointermove', e => { move(e); if (pointer.down) tuneFromPointer(); });
canvas.addEventListener('pointerup', () => { pointer.down = false; });
canvas.addEventListener('pointercancel', () => { pointer.down = false; });
canvas.addEventListener('pointerleave', () => { pointer.inside = false; pointer.down = false; });
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  audio.init();
  const step = Math.sign(e.deltaY) * (e.shiftKey ? 0.004 : 0.02);
  freq = clamp(freq * Math.exp(step), F_MIN, F_MAX);
}, { passive: false });

function move(e) {
  const r = canvas.getBoundingClientRect();
  pointer.x = e.clientX - r.left;
  pointer.y = e.clientY - r.top;
  pointer.inside = true;
}
function tuneFromPointer() {
  if (state !== 'play') return;
  if (pointer.y < L.dial.y - 14 || pointer.x < L.dial.x || pointer.x > L.dial.x + L.dial.w) return;
  freq = clamp(xToF(pointer.x), F_MIN, F_MAX);
}

window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (e.key === ' ') { e.preventDefault(); keys.space = true; audio.init(); }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') e.preventDefault();
  if (k === 'r') { audio.init(); startRun(); }
  if (k === 'm') { audio.init(); audio.muted = !audio.muted; }
});
window.addEventListener('keyup', e => {
  keys[e.key.toLowerCase()] = false;
  if (e.key === ' ') keys.space = false;
});
window.addEventListener('resize', layout);

// ---------------------------------------------------------------- update

function update(dt) {
  shake *= Math.pow(0.02, dt);
  for (let i = fx.length - 1; i >= 0; i--) {
    fx[i].t += dt;
    if (fx[i].t > fx[i].dur) fx.splice(i, 1);
  }
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    b.y -= b.v * dt;
    b.t += dt;
    if (b.y < L.surfaceY || b.t > 3) bubbles.splice(i, 1);
  }

  if (state !== 'play') { audio.setHum(80, 0); return; }

  // tuning by key
  const fine = keys.shift ? 0.25 : 1;
  if (keys.arrowleft  || keys.a) freq = clamp(freq * Math.exp(-0.9 * dt * fine), F_MIN, F_MAX);
  if (keys.arrowright || keys.d) freq = clamp(freq * Math.exp( 0.9 * dt * fine), F_MIN, F_MAX);
  boost = !!keys.space;

  audio.setHum(60 + freq * 1.7, 0.012 + (boost ? 0.016 : 0));

  power -= (1.1 + (boost ? 6.4 : 0)) * dt;
  if (power <= 0) { power = 0; endBatch(); return; }

  // feed
  const feedRate = 1.5 + batch * 0.16;
  spawnT += dt;
  while (spawned < feedPlan.length && spawnT > 1 / feedRate) {
    spawnT -= 1 / feedRate;
    spawnOne();
  }

  const flow = 58 + batch * 5;

  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.ph += dt;

    if (!p.lifted) {
      p.x += flow * dt;
      p.y += p.vy * dt;
      p.y = Math.min(p.y, L.bedY - p.r);

      const inZone = p.x > L.zone.x && p.x < L.zone.x + L.zone.w;
      if (inZone) {
        const rsp = response(p);
        p.heat += rsp * (boost ? 2.6 : 1) * 0.85 * dt;
        if (rsp > 0.12 && Math.random() < dt * rsp * 26) {
          bubbles.push({ x: p.x + rand(-p.r, p.r), y: p.y - p.r, v: rand(40, 90), r: rand(1, 2.6), t: 0 });
        }
      } else {
        p.heat = Math.max(0, p.heat - 0.16 * dt);
      }

      // enough vapour under it and it goes up
      if (p.heat >= 1) {
        p.lifted = true;
        p.vy = -34;
        audio.lift();
        fx.push({ k: 'pop', x: p.x, y: p.y, t: 0, dur: 0.4, c: p.m.color });
      }

      if (p.x > L.ch.x + L.ch.w + 30) {
        if (p.m.target) stat.tails++;
        parts.splice(i, 1);
      }
    } else {
      // riding a vapour pocket up to the surface, then along it to the skimmer
      p.x += flow * 0.85 * dt;
      if (p.y > L.surfaceY + p.r) {
        p.vy = lerp(p.vy, -120, 1 - Math.pow(0.02, dt));
        p.y += p.vy * dt;
        if (Math.random() < dt * 22) {
          bubbles.push({ x: p.x + rand(-p.r, p.r), y: p.y, v: rand(60, 130), r: rand(1, 2.4), t: 0 });
        }
      } else {
        p.y = L.surfaceY + p.r + Math.sin(p.ph * 4) * 1.6;
        if (p.x > L.skim) {
          collect(p);
          parts.splice(i, 1);
          continue;
        }
      }
      if (p.x > L.ch.x + L.ch.w + 30) parts.splice(i, 1);
    }
  }

  if (spawned >= feedPlan.length && parts.length === 0) endBatch();
}

function collect(p) {
  if (p.m.target) {
    stat.recovered++;
    stat.gross += p.m.value;
    score += p.m.value;
    audio.good();
    fx.push({ k: 'coin', x: p.x, y: p.y, t: 0, dur: 0.7, c: p.m.color, label: '+' + p.m.value });
  } else {
    stat.waste++;
    score = Math.max(0, score - 60);
    shake = Math.max(shake, 4);
    audio.bad();
    fx.push({ k: 'coin', x: p.x, y: p.y, t: 0, dur: 0.7, c: COL.red, label: 'GANGUE' });
  }
}

// ---------------------------------------------------------------- draw

function draw(time) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = COL.bg;
  ctx.fillRect(0, 0, W, H);

  const sx = shake > 0.05 ? rand(-shake, shake) : 0;
  const sy = shake > 0.05 ? rand(-shake, shake) : 0;

  ctx.save();
  ctx.beginPath(); ctx.rect(L.ch.x, 0, L.ch.w, L.ch.h); ctx.clip();
  ctx.translate(sx, sy);
  drawChute(time);
  drawParticles(time);
  drawFx();
  ctx.restore();

  drawDial(time);
  drawPanels(time);
  if (state === 'title')  drawTitle();
  if (state === 'report') drawReport();
  if (state === 'over')   drawOver();
  if (state === 'play' && pointer.inside) drawCursor();
}

function drawChute(time) {
  const c = L.ch;
  // fluid
  const g = ctx.createLinearGradient(0, L.surfaceY, 0, L.bedY);
  g.addColorStop(0, COL.fluid);
  g.addColorStop(1, COL.fluid2);
  ctx.fillStyle = g;
  ctx.fillRect(c.x, L.surfaceY, c.w, L.bedY - L.surfaceY);

  // surface
  ctx.strokeStyle = 'rgba(120,190,180,0.30)';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  for (let x = c.x; x <= c.x + c.w; x += 6) {
    const y = L.surfaceY + Math.sin(x * 0.03 + time * 2.1) * 2 + Math.sin(x * 0.011 - time * 1.3) * 1.4;
    x === c.x ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();

  // bed
  ctx.fillStyle = '#141a19';
  ctx.fillRect(c.x, L.bedY, c.w, L.dial.y - L.bedY);
  ctx.strokeStyle = COL.rule;
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(c.x, L.bedY + 0.5); ctx.lineTo(c.x + c.w, L.bedY + 0.5); ctx.stroke();

  // flow streaks
  ctx.strokeStyle = 'rgba(120,190,180,0.055)';
  for (let i = 0; i < 26; i++) {
    const y = L.surfaceY + 14 + ((i * 37) % (L.bedY - L.surfaceY - 22));
    const off = (time * (40 + (i % 5) * 12)) % 220;
    ctx.beginPath();
    ctx.moveTo(c.x + off - 60, y);
    ctx.lineTo(c.x + off - 20, y);
    ctx.stroke();
  }

  // the subjected portion, extending entirely across the chute
  const z = L.zone;
  const on = state === 'play';
  const amp = on ? (boost ? 0.20 : 0.10) : 0.04;
  const zg = ctx.createLinearGradient(z.x, 0, z.x + z.w, 0);
  zg.addColorStop(0, 'rgba(255,182,72,0)');
  zg.addColorStop(0.5, 'rgba(255,182,72,' + amp + ')');
  zg.addColorStop(1, 'rgba(255,182,72,0)');
  ctx.fillStyle = zg;
  ctx.fillRect(z.x, L.surfaceY, z.w, L.bedY - L.surfaceY);

  // field lines, spaced by the tuned frequency
  ctx.strokeStyle = 'rgba(255,182,72,' + (on ? 0.20 : 0.07) + ')';
  ctx.lineWidth = 1;
  const spacing = clamp(1400 / freq, 6, 46);
  for (let x = z.x; x < z.x + z.w; x += spacing) {
    const xx = x + ((time * 90) % spacing);
    if (xx > z.x + z.w) continue;
    ctx.beginPath(); ctx.moveTo(xx, L.surfaceY); ctx.lineTo(xx, L.bedY); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(255,182,72,0.45)';
  ctx.beginPath();
  ctx.moveTo(z.x, L.surfaceY); ctx.lineTo(z.x, L.bedY);
  ctx.moveTo(z.x + z.w, L.surfaceY); ctx.lineTo(z.x + z.w, L.bedY);
  ctx.stroke();

  ctx.fillStyle = COL.faint;
  ctx.font = (9.5 * L.hud) + 'px ui-monospace, Menlo, monospace';
  ctx.textAlign = 'center';
  ctx.fillText('SUBJECTED PORTION', z.x + z.w / 2, L.bedY + 15);

  // generator coil under the zone
  ctx.strokeStyle = on ? COL.amber : COL.faint;
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i <= 40; i++) {
    const t = i / 40;
    const x = z.x + z.w * 0.2 + z.w * 0.6 * t;
    const y = L.bedY + 30 + Math.sin(t * TAU * 5 + time * 8) * 5;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.stroke();

  // skimmer
  ctx.save();
  ctx.translate(L.skim, L.surfaceY - 2);
  ctx.strokeStyle = COL.teal;
  ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(0, 0, 5, 0, TAU); ctx.stroke();
  for (let i = 0; i < 4; i++) {
    const a = time * 2.6 + i / 4 * TAU;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * 5, Math.sin(a) * 5);
    ctx.lineTo(Math.cos(a) * 17, Math.sin(a) * 17);
    ctx.stroke();
  }
  ctx.restore();
  ctx.fillStyle = COL.faint;
  ctx.fillText('SKIMMER', L.skim, L.surfaceY - 26);
  ctx.textAlign = 'left';

  // launder and tailings labels
  ctx.fillStyle = COL.faint;
  ctx.textAlign = 'right';
  ctx.fillText('TAILINGS', L.ch.x + L.ch.w - 8, L.bedY - 8);
  ctx.textAlign = 'left';
  ctx.fillText('FEED', L.ch.x + 8, L.surfaceY - 8);

  // bubbles
  ctx.fillStyle = 'rgba(190,235,230,0.35)';
  for (const b of bubbles) {
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
  }
}

function drawParticles(time) {
  for (const p of parts) {
    const heat = clamp(p.heat, 0, 1);
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.ph * 0.4);

    if (heat > 0.05) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = 'rgba(255,122,60,' + heat * 0.30 + ')';
      ctx.beginPath(); ctx.arc(0, 0, p.r * (2 + heat), 0, TAU); ctx.fill();
      ctx.restore();
    }

    ctx.beginPath();
    for (let i = 0; i < p.shape.length; i++) {
      const a = i / p.shape.length * TAU;
      const rr = p.r * p.shape[i];
      const x = Math.cos(a) * rr, y = Math.sin(a) * rr;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.closePath();
    ctx.fillStyle = mixHex(p.m.color, COL.hot, heat * 0.7);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.45)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // a bright fleck so ore reads as ore
    if (p.m.target) {
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.beginPath(); ctx.arc(-p.r * 0.28, -p.r * 0.3, Math.max(1, p.r * 0.16), 0, TAU); ctx.fill();
    }
    ctx.restore();

    // heat ring
    if (heat > 0.02 && heat < 1) {
      ctx.strokeStyle = 'rgba(255,182,72,0.7)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r + 5, -Math.PI / 2, -Math.PI / 2 + heat * TAU);
      ctx.stroke();
    }
  }
}

function mixHex(a, b, t) {
  const pa = [parseInt(a.slice(1, 3), 16), parseInt(a.slice(3, 5), 16), parseInt(a.slice(5, 7), 16)];
  const pb = [parseInt(b.slice(1, 3), 16), parseInt(b.slice(3, 5), 16), parseInt(b.slice(5, 7), 16)];
  return 'rgb(' + pa.map((v, i) => Math.round(lerp(v, pb[i], t))).join(',') + ')';
}

function drawFx() {
  for (const f of fx) {
    const k = f.t / f.dur;
    if (f.k === 'pop') {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = f.c;
      ctx.globalAlpha = 1 - k;
      ctx.lineWidth = 2 * (1 - k) + 0.5;
      ctx.beginPath(); ctx.arc(f.x, f.y, 6 + 30 * k, 0, TAU); ctx.stroke();
      ctx.restore();
    } else {
      ctx.globalAlpha = 1 - k;
      ctx.fillStyle = f.c;
      ctx.font = (11 * L.hud) + 'px ui-monospace, Menlo, monospace';
      ctx.textAlign = 'center';
      ctx.fillText(f.label, f.x, f.y - 12 - k * 26);
      ctx.textAlign = 'left';
      ctx.globalAlpha = 1;
    }
  }
}

// ---------------------------------------------------------------- dial

function drawDial(time) {
  const d = L.dial;
  ctx.fillStyle = '#0a0e0f';
  ctx.fillRect(d.x, d.y, d.w, d.h);
  ctx.strokeStyle = COL.rule;
  ctx.lineWidth = 1;
  ctx.strokeRect(d.x + 0.5, d.y + 0.5, d.w - 1, d.h - 1);

  const bandY = d.y + 20, bandH = 16;

  // the target bands, each drawn from its own diameter
  for (const key of TARGETS) {
    const m = MINERAL[key];
    const fc = optimalMHz(m.d);
    const half = fc * BAND_FRAC;
    const x0 = fToX(fc - half), x1 = fToX(fc + half);
    ctx.fillStyle = m.color;
    ctx.globalAlpha = 0.24;
    ctx.fillRect(x0, bandY, Math.max(2, x1 - x0), bandH);
    ctx.globalAlpha = 1;
    ctx.fillStyle = m.color;
    ctx.fillRect(fToX(fc) - 0.5, bandY, 1, bandH);
    ctx.font = (8.5 * L.hud) + 'px ui-monospace, Menlo, monospace';
    ctx.textAlign = 'center';
    ctx.fillText(m.name, fToX(fc), bandY - 5);
    ctx.textAlign = 'left';
  }

  // ticks
  ctx.strokeStyle = COL.rule;
  ctx.fillStyle = COL.faint;
  ctx.font = (8.5 * L.hud) + 'px ui-monospace, Menlo, monospace';
  ctx.textAlign = 'center';
  for (const f of [10, 20, 50, 100, 200, 300]) {
    const x = fToX(f);
    ctx.beginPath(); ctx.moveTo(x, bandY + bandH); ctx.lineTo(x, bandY + bandH + 4); ctx.stroke();
    ctx.fillText(String(f), x, bandY + bandH + 14);
  }
  ctx.textAlign = 'left';

  // response window around the tuned point
  const half = freq * BAND_FRAC * (boost ? BOOST_BAND : 1);
  const wx0 = fToX(freq - half), wx1 = fToX(freq + half);
  ctx.fillStyle = boost ? 'rgba(255,122,60,0.20)' : 'rgba(255,182,72,0.13)';
  ctx.fillRect(wx0, bandY - 2, Math.max(2, wx1 - wx0), bandH + 4);

  // needle
  const nx = fToX(freq);
  ctx.strokeStyle = boost ? COL.hot : COL.amber;
  ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(nx, d.y + 6); ctx.lineTo(nx, d.y + d.h - 6); ctx.stroke();
  ctx.fillStyle = boost ? COL.hot : COL.amber;
  ctx.beginPath();
  ctx.moveTo(nx, d.y + 6); ctx.lineTo(nx - 4, d.y + 1); ctx.lineTo(nx + 4, d.y + 1);
  ctx.closePath(); ctx.fill();

  // readout, and the unit stays lower case on purpose
  ctx.font = (13 * L.hud) + 'px ui-monospace, Menlo, monospace';
  ctx.fillStyle = COL.text;
  ctx.textAlign = 'left';
  ctx.fillText(freq.toFixed(1) + ' MHz', d.x + 6, d.y + d.h - 6);
  ctx.font = (9.5 * L.hud) + 'px ui-monospace, Menlo, monospace';
  ctx.fillStyle = boost ? COL.hot : COL.faint;
  ctx.textAlign = 'right';
  ctx.fillText(boost ? 'FIELD BOOSTED, SELECTIVITY DOWN' : 'SPACE TO BOOST THE FIELD',
               d.x + d.w - 6, d.y + d.h - 6);
  ctx.textAlign = 'left';
}

function drawCursor() {
  ctx.strokeStyle = 'rgba(255,182,72,0.6)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(pointer.x, pointer.y, 7, 0, TAU); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(pointer.x - 12, pointer.y); ctx.lineTo(pointer.x - 4, pointer.y);
  ctx.moveTo(pointer.x + 4, pointer.y); ctx.lineTo(pointer.x + 12, pointer.y);
  ctx.stroke();
}

// ---------------------------------------------------------------- panels

function label(t, x, y) {
  ctx.fillStyle = COL.faint;
  ctx.font = (9.5 * L.hud) + 'px ui-monospace, Menlo, monospace';
  ctx.fillText(t, x, y);
}
function value(t, x, y, size, color) {
  ctx.fillStyle = color || COL.text;
  ctx.font = (size * L.hud) + 'px ui-monospace, Menlo, monospace';
  ctx.fillText(t, x, y);
}
function bar(x, y, w, h, frac, color) {
  ctx.fillStyle = '#12191a';
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w * clamp(frac, 0, 1), h);
  ctx.strokeStyle = COL.rule;
  ctx.lineWidth = 1;
  ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
}

function drawPanels(time) {
  ctx.fillStyle = COL.panel;
  ctx.fillRect(0, 0, L.left.w, H);
  ctx.fillRect(L.right.x, 0, L.right.w, H);
  ctx.strokeStyle = COL.rule;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(L.left.w + 0.5, 0); ctx.lineTo(L.left.w + 0.5, H);
  ctx.moveTo(L.right.x + 0.5, 0); ctx.lineTo(L.right.x + 0.5, H);
  ctx.stroke();

  const x = 18, bw = L.left.w - 36;
  let y = 34;
  ctx.textAlign = 'left';
  value('SEPARATOR', x, y, 17, COL.amber); y += 15;
  label('RADIOFREQUENCY PARTICLE', x, y); y += 12;
  label('SEPARATOR', x, y); y += 26;
  ctx.strokeStyle = COL.rule;
  ctx.beginPath(); ctx.moveTo(x, y - 12); ctx.lineTo(L.left.w - 18, y - 12); ctx.stroke();

  label('VALUE RECOVERED', x, y); y += 24;
  value(String(score).padStart(6, '0'), x, y, 24, COL.text); y += 28;

  label('BATCH', x, y); y += 21;
  value(String(batch).padStart(2, '0'), x, y, 19, COL.text); y += 28;

  label('GENERATOR POWER', x, y); y += 12;
  bar(x, y, bw, 8, power / 100, power < 25 ? COL.red : COL.amber); y += 28;

  if (stat) {
    const collected = stat.recovered + stat.waste;
    const grade = collected ? stat.recovered / collected : 0;
    const recovery = stat.targets ? stat.recovered / stat.targets : 0;

    label('GRADE', x, y); y += 12;
    bar(x, y, bw, 7, grade, grade >= 0.70 ? COL.teal : COL.red); y += 12;
    value(Math.round(grade * 100) + ' %, need 70', x, y, 10, COL.dim); y += 22;

    label('RECOVERY', x, y); y += 12;
    bar(x, y, bw, 7, recovery, recovery >= 0.55 ? COL.teal : COL.amber); y += 12;
    value(Math.round(recovery * 100) + ' %, need 55', x, y, 10, COL.dim); y += 26;

    label('CONCENTRATE', x, y); y += 16;
    value(stat.recovered + ' ore', x, y, 12, COL.text); y += 14;
    value(stat.waste + ' gangue', x, y, 12, stat.waste ? COL.red : COL.faint); y += 14;
    value(stat.tails + ' to tailings', x, y, 12, COL.dim); y += 26;
  }

  label('FAILED BATCHES', x, y); y += 18;
  for (let i = 0; i < MAX_STRIKES; i++) {
    ctx.strokeStyle = i < strikes ? COL.red : COL.rule;
    ctx.fillStyle = COL.red;
    ctx.beginPath(); ctx.arc(x + 7 + i * 22, y, 6, 0, TAU);
    if (i < strikes) ctx.fill();
    ctx.stroke();
  }

  // ---- right panel, the assay table
  const rx = L.right.x + 18;
  let ry = 34;
  value('ASSAY', rx, ry, 12, COL.amber); ry += 14;
  label('TUNING FROM DIAMETER', rx, ry); ry += 20;
  ctx.strokeStyle = COL.rule;
  ctx.beginPath(); ctx.moveTo(rx, ry - 8); ctx.lineTo(W - 18, ry - 8); ctx.stroke();
  ry += 8;

  label('MINERAL', rx, ry);
  ctx.textAlign = 'right'; label('mm', W - 74, ry); label('optimum', W - 18, ry); ctx.textAlign = 'left';
  ry += 16;

  for (const key of TARGETS) {
    const m = MINERAL[key];
    const fc = optimalMHz(m.d);
    const onBand = Math.abs(freq - fc) < fc * BAND_FRAC * (boost ? BOOST_BAND : 1);
    ctx.fillStyle = m.color;
    ctx.beginPath(); ctx.arc(rx + 4, ry - 4, 4, 0, TAU); ctx.fill();
    value(m.name, rx + 15, ry, 10.5, onBand ? COL.text : COL.dim);
    ctx.textAlign = 'right';
    value(m.d.toFixed(2), W - 74, ry, 10.5, COL.dim);
    value(fc.toFixed(0) + ' MHz', W - 18, ry, 10.5, onBand ? COL.amber : COL.dim);
    ctx.textAlign = 'left';
    ry += 20;
  }
  ry += 6;
  ctx.strokeStyle = COL.rule;
  ctx.beginPath(); ctx.moveTo(rx, ry - 8); ctx.lineTo(W - 18, ry - 8); ctx.stroke();
  ry += 8;
  for (const key of ['quartz', 'shale']) {
    const m = MINERAL[key];
    ctx.fillStyle = m.color;
    ctx.beginPath(); ctx.arc(rx + 4, ry - 4, 4, 0, TAU); ctx.fill();
    value(m.name, rx + 15, ry, 10.5, COL.dim);
    ctx.textAlign = 'right';
    value('any', W - 74, ry, 10.5, COL.dim);
    value('follows size', W - 18, ry, 10.5, COL.faint);
    ctx.textAlign = 'left';
    ry += 20;
  }

  ry += 18;
  const noteLines = [
    'Skin depth falls with the square',
    'root of frequency, so a bigger',
    'grain tunes lower. Every number',
    'above comes off one diameter,',
    'by one formula.',
    '',
    'Gangue has no band of its own.',
    'It heats whenever its size',
    'happens to match your dial, and',
    'boosting widens the window.',
  ];
  for (const ln of noteLines) { value(ln, rx, ry, 9.5, COL.faint); ry += 13; }

  }

function overlay() {
  ctx.fillStyle = 'rgba(7,9,10,0.91)';
  ctx.fillRect(L.ch.x, 0, L.ch.w, L.ch.h);
}

function drawTitle() {
  const c = L.ch;
  overlay();
  ctx.textAlign = 'center';
  let y = c.h * 0.22;
  value('SEPARATOR', c.cx, y, Math.min(52, c.w * 0.085), COL.amber); y += 26;
  value('TUNE THE FIELD TO THE GRAIN', c.cx, y, 12, COL.dim); y += 48;
  const lines = [
    ['SCROLL TO TUNE', 'two fingers on the trackpad, or the arrow keys, or drag the dial'],
    ['SIZE IS THE CLUE', 'a big grain wants a low frequency, a fine one wants a high one'],
    ['HOLD SPACE TO BOOST', 'heats faster, widens the window, and lifts rock you did not want'],
    ['WATCH THE GRADE', 'gangue in the concentrate costs more than ore in the tailings'],
    ['CLEAR THE BATCH', 'seventy percent grade and fifty five percent recovery, or it fails'],
  ];
  for (const ln of lines) {
    value(ln[0], c.cx, y, 12, COL.teal); y += 15;
    value(ln[1], c.cx, y, 11, COL.dim); y += 27;
  }
  y += 8;
  ctx.globalAlpha = 0.55 + 0.45 * Math.sin(performance.now() / 260);
  value('CLICK TO START THE FEED', c.cx, y, 14, COL.amber);
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
}

function drawReport() {
  const c = L.ch;
  overlay();
  const r = stat.report;
  ctx.textAlign = 'center';
  let y = c.h * 0.30;
  value(r.pass ? 'BATCH CLEARED' : 'BATCH REJECTED', c.cx, y, 34, r.pass ? COL.teal : COL.red);
  y += 46;
  value('GRADE      ' + Math.round(r.grade * 100) + ' %', c.cx, y, 15,
        r.grade >= 0.70 ? COL.text : COL.red); y += 22;
  value('RECOVERY   ' + Math.round(r.recovery * 100) + ' %', c.cx, y, 15,
        r.recovery >= 0.55 ? COL.text : COL.red); y += 22;
  value('ORE        ' + stat.recovered + ' of ' + stat.targets, c.cx, y, 12, COL.dim); y += 18;
  value('GANGUE     ' + stat.waste, c.cx, y, 12, COL.dim); y += 44;
  ctx.globalAlpha = 0.55 + 0.45 * Math.sin(performance.now() / 260);
  value('CLICK FOR THE NEXT BATCH', c.cx, y, 14, COL.amber);
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
}

function drawOver() {
  const c = L.ch;
  overlay();
  ctx.textAlign = 'center';
  let y = c.h * 0.36;
  value('PLANT SHUT DOWN', c.cx, y, 36, COL.red); y += 26;
  value('THREE BATCHES REJECTED', c.cx, y, 12, COL.dim); y += 52;
  value('VALUE RECOVERED  ' + String(score).padStart(6, '0'), c.cx, y, 18, COL.text); y += 24;
  value('BATCHES RUN  ' + batch, c.cx, y, 12, COL.dim); y += 48;
  ctx.globalAlpha = 0.55 + 0.45 * Math.sin(performance.now() / 260);
  value('CLICK TO RUN THE PLANT AGAIN', c.cx, y, 14, COL.amber);
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
}

// ---------------------------------------------------------------- loop

let last = performance.now();
function step(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw(now / 1000);
}
function frame(now) { step(now); requestAnimationFrame(frame); }
// Some embedded webviews throttle requestAnimationFrame to nothing. If frames
// stop arriving, keep the loop alive on a timer.
setInterval(() => { if (performance.now() - last > 40) step(performance.now()); }, 16);

layout();
startBatch(1);
state = 'title';
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
