<body>

<div class="stage"><canvas id="c"></canvas></div>
<script>
// The bar talks to the game the same way a keyboard does, so the game needs no
// hook of its own and the two stay independent.
document.querySelectorAll('.gamebar button').forEach(b => {
  b.addEventListener('click', () => {
    window.dispatchEvent(new KeyboardEvent('keydown', { key: b.dataset.key }));
    if (b.id === 'sndbtn') {
      b.dataset.off = b.dataset.off ? '' : '1';
      b.textContent = b.dataset.off ? 'SOUND OFF' : 'SOUND ON';
    }
    b.blur();
  });
});
</script>

<script>
(() => {
'use strict';

// ---------------------------------------------------------------- constants

const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeIn = t => t * t * t;

const COL = {
  bg:       '#04070a',
  panel:    '#080d11',
  rule:     '#12262c',
  teal:     '#35e0d0',
  tealDim:  '#1a6f6c',
  text:     '#cfe6e6',
  dim:      '#4d6f74',
  cyan:     '#7ee0ff',   // --holo-cyan, the working accent
  red:      '#ff4d5e',
};

const TYPES = [
  { id: 'skin',   name: 'SKIN CELL',      color: '#d9c8a4', pts: 30, weight: 30, size: 2.2 },
  { id: 'dust',   name: 'DUST',           color: '#8d99a6', pts: 30, weight: 26, size: 2.0 },
  { id: 'lint',   name: 'LINT',           color: '#9fd4ff', pts: 45, weight: 18, size: 2.7 },
  { id: 'pollen', name: 'POLLEN',         color: '#ffd166', pts: 60, weight: 14, size: 2.5 },
  { id: 'bact',   name: 'BACTERIA',       color: '#93dd86', pts: 75, weight: 8,  size: 1.8 },
  { id: 'trace',  name: 'TRACE COMPOUND', color: '#ff4d5e', pts: 400, weight: 0, size: 3.6, flagged: true },
];
const TYPE_BY_ID = Object.fromEntries(TYPES.map(t => [t.id, t]));
const WEIGHT_TOTAL = TYPES.reduce((s, t) => s + t.weight, 0);

function pickType() {
  let r = Math.random() * WEIGHT_TOTAL;
  for (const t of TYPES) { r -= t.weight; if (r <= 0) return t; }
  return TYPES[0];
}

// laser + heat
const PULSE_HEAT   = 16;
const BEAM_HEAT    = 24;   // per second
const COOL_RATE    = 30;   // per second
const OVERHEAT_LOCK = 1.6; // seconds
const PULSE_RADIUS = 62;   // screen px
const BEAM_RADIUS  = 155;
const BEAM_FORCE   = 2800;

const MAX_MISSES = 3;

// ---------------------------------------------------------------- body model

// Local units: figure runs about y = -99 (crown) to y = +86 (soles).
function capsule(p, x1, y1, x2, y2, r) {
  const dx = x2 - x1, dy = y2 - y1;
  const len = Math.hypot(dx, dy);
  if (len < 1e-6) { p.moveTo(x1 + r, y1); p.arc(x1, y1, r, 0, TAU, true); return; }
  const a = Math.atan2(dy, dx);
  const nx = -dy / len, ny = dx / len;
  p.moveTo(x1 + nx * r, y1 + ny * r);
  p.lineTo(x2 + nx * r, y2 + ny * r);
  p.arc(x2, y2, r, a + Math.PI / 2, a - Math.PI / 2, true);
  p.lineTo(x1 - nx * r, y1 - ny * r);
  p.arc(x1, y1, r, a - Math.PI / 2, a + Math.PI / 2, true);
  p.closePath();
}

// Every part is drawn with the same helper so the winding stays consistent and
// the nonzero fill unions them instead of punching holes.
function buildBody(pose) {
  const p = new Path2D();
  const armOut = pose.armOut;     // how far the arms are held from the torso
  const stance = pose.stance;     // foot separation
  capsule(p, 0, -85, 0, -77, 14);                                  // head
  capsule(p, 0, -70, 0, -62, 5.2);                                 // neck
  capsule(p, -15, -56, 15, -56, 13.5);                             // shoulders
  capsule(p, 0, -52, 0, -14, 15);                                  // torso
  capsule(p, -8, -8, 8, -8, 13);                                   // pelvis
  for (const s of [-1, 1]) {
    capsule(p, s * 18, -55, s * (23 + armOut), -20, 6.4);          // upper arm
    capsule(p, s * (23 + armOut), -20, s * (25 + armOut * 1.5), 10, 5.4); // forearm
    capsule(p, s * (25 + armOut * 1.5), 10, s * (25 + armOut * 1.5), 17, 4.8); // hand
    capsule(p, s * 8, -6, s * (9 + stance), 34, 9);                // thigh
    capsule(p, s * (9 + stance), 34, s * (10 + stance), 74, 6.8);  // shin
    capsule(p, s * (10 + stance), 79, s * (14 + stance), 79, 5.2); // foot
  }
  return p;
}

// dedicated context for hit tests so the main transform is never disturbed
const hitCtx = document.createElement('canvas').getContext('2d');

// ---------------------------------------------------------------- audio

const audio = {
  ctx: null, muted: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) this.ctx = new AC();
  },
  tone(freq, freq2, dur, type, gain) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(30, freq2), t + dur);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(this.ctx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  },
  pulse()   { this.tone(880, 180, 0.11, 'sawtooth', 0.06); },
  capture() { this.tone(520, 900, 0.07, 'sine', 0.045); },
  flagged() { this.tone(300, 1300, 0.16, 'square', 0.05); },
  overheat(){ this.tone(160, 70, 0.3, 'square', 0.07); },
  miss()    { this.tone(220, 90, 0.35, 'triangle', 0.06); },
  arrive()  { this.tone(300, 460, 0.09, 'sine', 0.035); },
};

// ---------------------------------------------------------------- game state

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });

let W = 0, H = 0, dpr = 1;
let L = {};        // layout
let state = 'title';
let shift = 0, score = 0, misses = 0, year = 2026;
let captured = 0, released = 0;   // running totals for the report line

let subject = null;
let loose = [];
let fx = [];
let feed = [];
let shake = 0;
let frags = [];

const laser = { heat: 0, lock: 0, firing: false, x: 0, y: 0, onBody: false, beamT: 0 };
const pointer = { x: 0, y: 0, down: false, inside: false };

function layout() {
  const rect = canvas.getBoundingClientRect();
  dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.height * dpr);
  W = rect.width; H = rect.height;

  const narrow = W < 900;
  L = { narrow };

  if (narrow) {
    // on a phone the side panels become bars laid over the chamber
    L.left  = { x: 0, w: 0 };
    L.right = { x: W, w: 0 };
    L.ch    = { x: 0, y: 0, w: W, h: H };
    L.topH  = 168;
    L.botH  = 64;
    L.hud   = clamp(W / 300, 1.2, 1.8);
    L.floorY = H * 0.82;
    L.figH   = clamp(H * 0.44, 180, 420);
    L.clock  = { cx: W / 2, cy: 86, r: 52 };
  } else {
    const padL = W >= 1180 ? 272 : 236;
    const padR = W >= 1180 ? 304 : 252;
    L.left  = { x: 0, w: padL };
    L.right = { x: W - padR, w: padR };
    L.ch    = { x: padL, y: 0, w: W - padL - padR, h: H };
    L.topH  = 0; L.botH = 0;
    L.hud   = clamp(H / 660, 1.1, 1.45);
    L.floorY = H * 0.895;
    L.figH   = clamp(H * 0.62, 280, 560);
    L.clock  = { cx: L.ch.x + L.ch.w / 2, cy: 18 + 58, r: 58 };
  }

  L.ch.cx = L.ch.x + L.ch.w / 2;
  L.figScale = L.figH / 185;
  L.intake = { w: Math.min(480, L.ch.w * (narrow ? 0.76 : 0.56)), h: 24, y: L.floorY + 8 };
  // Two outlets per side wall, fixed, near the top. Four beams that cross at
  // the point you aim at, which is where the intensity finally gets high
  // enough to lift anything. Two photon, or four, since it is a birthday.
  const inset = L.ch.x + (narrow ? 17 : 30);
  const hiY = (narrow ? L.topH + 30 : 0) + H * (narrow ? 0.10 : 0.10);
  const loY = hiY + H * 0.11;
  L.emitters = [
    { x: inset, y: hiY, s: 1 },
    { x: inset, y: loY, s: 1 },
    { x: L.ch.x + L.ch.w - (inset - L.ch.x), y: hiY, s: -1 },
    { x: L.ch.x + L.ch.w - (inset - L.ch.x), y: loY, s: -1 },
  ];
}

// ---------------------------------------------------------------- subject

function newSubject() {
  const pose = { armOut: rand(0, 5), stance: rand(0, 4) };
  const path = buildBody(pose);
  const count = Math.min(96, 34 + shift * 5);
  const flagCount = Math.min(4, 1 + Math.floor(shift / 2));

  // rejection sample points inside the silhouette, in body local units
  const pts = [];
  let guard = 0;
  while (pts.length < count && guard < count * 300) {
    guard++;
    const x = rand(-34, 34), y = rand(-99, 86);
    if (Math.abs(x) < 14 && y > -6 && y < 22) continue;   // not there
    if (!hitCtx.isPointInPath(path, x, y)) continue;
    pts.push({ x, y });
  }
  const parts = pts.map((pt, i) => ({
    lx: pt.x, ly: pt.y,
    type: i < flagCount ? TYPE_BY_ID.trace : pickType(),
    ph: rand(0, TAU),
  }));
  // shuffle so the flagged ones are not all clustered at the sample head
  for (let i = parts.length - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    [parts[i], parts[j]] = [parts[j], parts[i]];
  }

  return {
    path, pose, parts,
    id: 'SB' + String(1740 + shift * 7 + ((Math.random() * 60) | 0)).padStart(4, '0'),
    phase: 'enter', t: 0,
    enterDur: 0.85, exitDur: 1.0,
    scanTime: Math.max(16, 26 - shift * 0.7),
    scanLeft: Math.max(16, 26 - shift * 0.7),
    x: L.ch.x - 70,
    turb: 0.45 + shift * 0.09,
    flagTotal: flagCount,
  };
}

function subjectTransform(s) {
  return { x: s.x, y: L.floorY - L.figH * (86 / 185), s: L.figScale };
}
function toScreen(s, lx, ly) {
  const t = subjectTransform(s);
  return { x: t.x + lx * t.s, y: t.y + ly * t.s };
}
function toLocal(s, sx, sy) {
  const t = subjectTransform(s);
  return { x: (sx - t.x) / t.s, y: (sy - t.y) / t.s };
}

// ---------------------------------------------------------------- particles

function dislodge(sx, sy, radius) {
  if (!subject) return 0;
  const t = subjectTransform(subject);
  const rLocal = radius / t.s;
  let n = 0;
  for (let i = subject.parts.length - 1; i >= 0; i--) {
    const p = subject.parts[i];
    const d = Math.hypot(p.lx - (sx - t.x) / t.s, p.ly - (sy - t.y) / t.s);
    if (d > rLocal) continue;
    const scr = toScreen(subject, p.lx, p.ly);
    const ang = Math.atan2(scr.y - sy, scr.x - sx) + rand(-0.5, 0.5);
    const sp = rand(70, 190) * (1 - d / rLocal * 0.55);
    loose.push({
      x: scr.x, y: scr.y,
      vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - rand(20, 70),
      type: p.type, ph: rand(0, TAU), age: 0,
    });
    shatter(scr.x, scr.y, p.type.color, 5, 120);
    subject.parts.splice(i, 1);
    n++;
  }
  return n;
}

// Particles come apart rather than blinking out. Small burst when the beams
// knock one off the subject, a proper one when the analyser takes it.
function shatter(x, y, color, n, speed) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), sp = rand(speed * 0.3, speed);
    frags.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - rand(0, speed * 0.2),
      r: rand(0.7, 2.2), c: color, t: 0, life: rand(0.25, 0.62),
    });
  }
}

function capture(p) {
  shatter(p.x, p.y, p.type.color, p.type.flagged ? 26 : 15,
          p.type.flagged ? 300 : 210);
  score += p.type.pts;
  captured++;
  addFeed(p.type);
  fx.push({ k: 'cap', x: p.x, y: p.y, t: 0, dur: 0.35, c: p.type.color });
  if (p.type.flagged) audio.flagged();
  else audio.capture();
}

function addFeed(type) {
  const top = feed[0];
  if (top && top.type === type && top.age < 2.5) { top.n++; top.age = 0; return; }
  feed.unshift({ type, n: 1, age: 0 });
  if (feed.length > 9) feed.length = 9;
}

// ---------------------------------------------------------------- input

function fire() {
  if (laser.lock > 0 || state !== 'play') return;
  const { x, y } = pointer;
  if (x < L.ch.x || x > L.ch.x + L.ch.w) return;

  laser.heat += PULSE_HEAT;
  laser.beamT = 1;
  audio.pulse();
  fx.push({ k: 'ring', x, y, t: 0, dur: 0.3, r: PULSE_RADIUS });

  const n = subject ? dislodge(x, y, PULSE_RADIUS) : 0;
  released += n;

  if (laser.heat >= 100) {
    laser.heat = 100;
    laser.lock = OVERHEAT_LOCK;
    audio.overheat();
  }
}

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  updatePointer(e);
  audio.init();
  pointer.down = true;
  if (state === 'title') { startRun(); return; }
  if (state === 'over')  { startRun(); return; }
  fire();
});
canvas.addEventListener('pointermove', updatePointer);
canvas.addEventListener('pointerup', () => { pointer.down = false; });
canvas.addEventListener('pointercancel', () => { pointer.down = false; });
canvas.addEventListener('pointerenter', () => { pointer.inside = true; });
canvas.addEventListener('pointerleave', () => { pointer.inside = false; pointer.down = false; });

function updatePointer(e) {
  const r = canvas.getBoundingClientRect();
  pointer.x = e.clientX - r.left;
  pointer.y = e.clientY - r.top;
  pointer.inside = true;
}

window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'r') { audio.init(); startRun(); }
  if (k === 'm') { audio.init(); audio.muted = !audio.muted; }
});
window.addEventListener('resize', () => { layout(); });

// ---------------------------------------------------------------- run

function startRun() {
  layout();
  shift = 1; score = 0; misses = 0; captured = 0; released = 0; year = 2026;
  loose = []; fx = []; feed = []; frags = [];
  laser.heat = 0; laser.lock = 0; laser.beamT = 0;
  subject = newSubject();
  audio.arrive();
  state = 'play';
}

function endSubject() {
  year++;
  let missed = subject.parts.filter(p => p.type.flagged).length;
  missed += loose.filter(p => p.type.flagged).length;
  if (missed > 0) {
    misses += 1;
    audio.miss();
    feed.unshift({ warn: true, text: missed + ' FLAGGED LOST', age: 0 });
    if (feed.length > 9) feed.length = 9;
  } else {
    feed.unshift({ ok: true, text: 'SUBJECT CLEARED', age: 0 });
    if (feed.length > 9) feed.length = 9;
    score += 500;
  }
  loose = loose.filter(p => !p.type.flagged);
  if (misses >= MAX_MISSES) { state = 'over'; return; }
  shift++;
  subject = newSubject();
  audio.arrive();
}

// ---------------------------------------------------------------- update

function update(dt) {
  shake *= Math.pow(0.02, dt);
  for (let i = fx.length - 1; i >= 0; i--) {
    fx[i].t += dt;
    if (fx[i].t > fx[i].dur) fx.splice(i, 1);
  }
  const fdrag = Math.pow(0.04, dt);
  for (let i = frags.length - 1; i >= 0; i--) {
    const f = frags[i];
    f.t += dt;
    f.x += f.vx * dt; f.y += f.vy * dt;
    f.vx *= fdrag; f.vy *= fdrag;
    if (f.t >= f.life) frags.splice(i, 1);
  }
  for (const f of feed) f.age += dt;

  laser.beamT = Math.max(0, laser.beamT - dt * 5);
  laser.onBody = false;

  if (state !== 'play') { updateLoose(dt, 0.4); return; }

  // heat
  if (laser.lock > 0) {
    laser.lock -= dt;
    laser.heat = Math.max(0, laser.heat - dt * (100 / OVERHEAT_LOCK));
  } else if (pointer.down && pointer.inside) {
    laser.heat += BEAM_HEAT * dt;
    if (laser.heat >= 100) { laser.heat = 100; laser.lock = OVERHEAT_LOCK; audio.overheat(); }
  } else {
    laser.heat = Math.max(0, laser.heat - COOL_RATE * dt);
  }

  const beamOn = pointer.down && pointer.inside && laser.lock <= 0 &&
                 pointer.x > L.ch.x && pointer.x < L.ch.x + L.ch.w;

  // subject phase machine
  const s = subject;
  s.t += dt;
  if (s.phase === 'enter') {
    const k = easeOut(clamp(s.t / s.enterDur, 0, 1));
    s.x = lerp(L.ch.x - 70, L.ch.cx, k);
    if (s.t >= s.enterDur) { s.phase = 'scan'; s.t = 0; s.x = L.ch.cx; }
  } else if (s.phase === 'scan') {
    s.x = L.ch.cx + Math.sin(s.t * 1.4) * 1.6;
    s.scanLeft -= dt;
    const flaggedLeft = s.parts.some(p => p.type.flagged) ||
                        loose.some(p => p.type.flagged);
    if (s.scanLeft <= 0 || (s.parts.length === 0 && !flaggedLeft)) {
      s.phase = 'exit'; s.t = 0;
    }
  } else {
    const k = easeIn(clamp(s.t / s.exitDur, 0, 1));
    s.x = lerp(L.ch.cx, L.ch.x + L.ch.w + 70, k);
    if (s.t >= s.exitDur) { endSubject(); return; }
  }

  // pointer over the body?
  if (s.phase !== 'exit') {
    const lp = toLocal(s, pointer.x, pointer.y);
    laser.onBody = hitCtx.isPointInPath(s.path, lp.x, lp.y);
  }

  // the beam keeps ablating while held
  if (beamOn) {
    if (Math.random() < dt * 14) released += dislodge(pointer.x, pointer.y, PULSE_RADIUS * 0.55);
  }

  updateLoose(dt, s.turb, beamOn);
}

function updateLoose(dt, turb, beamOn) {
  const iw = L.intake.w, ix = L.ch.cx - iw / 2, iy = L.intake.y;
  const now = performance.now() / 1000;

  for (let i = loose.length - 1; i >= 0; i--) {
    const p = loose[i];
    p.age += dt;

    // buoyant drift plus a little turbulence: light debris rises out of frame
    let ax = Math.sin(now * 1.7 + p.ph * 3.1 + p.y * 0.012) * 26 * turb;
    let ay = -13 - (p.type.flagged ? -7 : 0);

    if (beamOn) {
      const dx = pointer.x - p.x, dy = pointer.y - p.y;
      const d = Math.hypot(dx, dy);
      if (d < BEAM_RADIUS) {
        const f = BEAM_FORCE * (1 - d / BEAM_RADIUS);
        ax += dx / (d + 1) * f;
        ay += dy / (d + 1) * f;
      }
    }

    // intake suction near the vent mouth
    const overVent = p.x > ix - 70 && p.x < ix + iw + 70 && p.y > iy - 300;
    if (overVent) {
      ay += 520 * (1 - clamp((iy - p.y) / 300, 0, 1));
      ax += ((ix + iw / 2) - p.x) * 1.2;
    }

    p.vx += ax * dt; p.vy += ay * dt;
    const drag = Math.pow(0.06, dt);
    p.vx *= drag; p.vy *= drag;
    p.x += p.vx * dt; p.y += p.vy * dt;

    // captured
    if (p.y >= iy && p.x > ix && p.x < ix + iw) { capture(p); loose.splice(i, 1); continue; }

    // floor bounce, so nothing gets stranded outside the vent
    if (p.y > L.floorY + 4 && !(p.x > ix && p.x < ix + iw)) {
      p.y = L.floorY + 4; p.vy = -Math.abs(p.vy) * 0.35;
    }
    // walls
    if (p.x < L.ch.x + 4) { p.x = L.ch.x + 4; p.vx = Math.abs(p.vx) * 0.4; }
    if (p.x > L.ch.x + L.ch.w - 4) { p.x = L.ch.x + L.ch.w - 4; p.vx = -Math.abs(p.vx) * 0.4; }

    // lost out of the top
    if (p.y < L.topH - 14) {   // on a phone they are gone once under the bar
      if (p.type.flagged) { /* counted at the end of the subject */ }
      loose.splice(i, 1);
    }
  }
}

// ---------------------------------------------------------------- draw

function draw(time) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = COL.bg;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  drawChamber(time);
  if (subject && state !== 'title') drawSubject(subject, time);
  drawLoose(time);
  drawFrags();
  drawFx();
  if (state === 'play') drawLaser(time);
  ctx.restore();

  drawGoal(time);
  drawPanels(time);
  if (state === 'title') drawTitle();
  if (state === 'over') drawOver();
  if (state === 'play' && pointer.inside) drawCursor();
}

function drawChamber(time) {
  const c = L.ch;
  // back wall
  ctx.fillStyle = '#060b0f';
  ctx.fillRect(c.x, c.y, c.w, c.h);

  // floor grid
  ctx.save();
  ctx.beginPath(); ctx.rect(c.x, L.floorY, c.w, c.h - L.floorY + 30); ctx.clip();
  ctx.strokeStyle = 'rgba(53,224,208,0.10)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 12; i++) {
    const t = i / 12;
    const xTop = lerp(c.x + c.w * 0.30, c.x + c.w * 0.70, t);
    const xBot = lerp(c.x - c.w * 0.2, c.x + c.w * 1.2, t);
    ctx.beginPath(); ctx.moveTo(xTop, L.floorY); ctx.lineTo(xBot, c.h + 30); ctx.stroke();
  }
  for (let i = 1; i <= 7; i++) {
    const y = L.floorY + Math.pow(i / 7, 1.9) * (c.h - L.floorY + 30);
    ctx.beginPath(); ctx.moveTo(c.x, y); ctx.lineTo(c.x + c.w, y); ctx.stroke();
  }
  ctx.restore();

  // horizon
  ctx.strokeStyle = 'rgba(53,224,208,0.28)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(c.x, L.floorY + .5); ctx.lineTo(c.x + c.w, L.floorY + .5); ctx.stroke();

  // the four outlet housings, fixed to the side walls
  for (const e of L.emitters) {
    ctx.fillStyle = '#0b171b';
    ctx.strokeStyle = laser.lock > 0 ? COL.red : COL.teal;
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(e.x - 9 * e.s, e.y - 13);
    ctx.lineTo(e.x - 9 * e.s, e.y + 13);
    ctx.lineTo(e.x + 11 * e.s, e.y + 7);
    ctx.lineTo(e.x + 11 * e.s, e.y - 7);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = laser.lock > 0 ? COL.red : COL.teal;
    ctx.fillRect(e.x + 9 * e.s, e.y - 2, 3 * e.s, 4);
  }

  // intake vent
  const iw = L.intake.w, ix = c.cx - iw / 2, iy = L.intake.y;
  const pulse = 0.5 + 0.5 * Math.sin(time * 2.2);
  ctx.fillStyle = '#020506';
  ctx.fillRect(ix, iy, iw, L.intake.h);
  ctx.strokeStyle = `rgba(53,224,208,${0.35 + pulse * 0.25})`;
  ctx.lineWidth = 1.5;
  ctx.strokeRect(ix + .5, iy + .5, iw - 1, L.intake.h - 1);
  ctx.save();
  ctx.beginPath(); ctx.rect(ix, iy, iw, L.intake.h); ctx.clip();
  ctx.strokeStyle = 'rgba(53,224,208,0.30)';
  ctx.lineWidth = 1;
  for (let x = ix - 20; x < ix + iw + 20; x += 9) {
    ctx.beginPath();
    ctx.moveTo(x + ((time * 26) % 9), iy);
    ctx.lineTo(x - 10 + ((time * 26) % 9), iy + L.intake.h);
    ctx.stroke();
  }
  ctx.restore();
  // suction haze
  const g = ctx.createLinearGradient(0, iy - 70, 0, iy);
  g.addColorStop(0, 'rgba(53,224,208,0)');
  g.addColorStop(1, `rgba(53,224,208,${0.05 + pulse * 0.04})`);
  ctx.fillStyle = g;
  ctx.fillRect(ix, iy - 70, iw, 70);

  ctx.fillStyle = COL.tealDim;
  ctx.font = `${10 * L.hud}px ui-monospace, Menlo, monospace`;
  ctx.textAlign = 'center';
  ctx.fillText('INTAKE', c.cx, iy + L.intake.h + 13);
  ctx.textAlign = 'left';
}

function drawSubject(s, time) {
  const t = subjectTransform(s);
  const alpha = s.phase === 'exit' ? 1 - clamp(s.t / s.exitDur, 0, 1) * 0.7 : 1;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(t.x, t.y);
  ctx.scale(t.s, t.s);
  ctx.lineWidth = 1.6 / t.s;

  // body fill
  ctx.fillStyle = 'rgba(20,58,64,0.55)';
  ctx.fill(s.path);

  // sensor scan lines inside the silhouette
  ctx.save();
  ctx.clip(s.path);
  ctx.strokeStyle = 'rgba(53,224,208,0.16)';
  ctx.lineWidth = 0.8 / t.s;
  const off = (time * 9) % 6;
  for (let y = -104; y < 92; y += 6) {
    ctx.beginPath(); ctx.moveTo(-40, y + off); ctx.lineTo(40, y + off); ctx.stroke();
  }
  // moving sensor bar
  const bar = -104 + ((time * 52) % 200);
  const bg = ctx.createLinearGradient(0, bar - 14, 0, bar + 14);
  bg.addColorStop(0, 'rgba(53,224,208,0)');
  bg.addColorStop(0.5, 'rgba(53,224,208,0.22)');
  bg.addColorStop(1, 'rgba(53,224,208,0)');
  ctx.fillStyle = bg;
  ctx.fillRect(-40, bar - 14, 80, 28);
  ctx.restore();

  // outline
  ctx.strokeStyle = laser.onBody ? '#7ff2e6' : COL.teal;
  ctx.stroke(s.path);
  ctx.restore();

  // attached particles
  for (const p of s.parts) {
    const scr = toScreen(s, p.lx, p.ly);
    const r = p.type.size * (0.85 + 0.15 * Math.sin(time * 3 + p.ph));
    ctx.globalAlpha = alpha;
    if (p.type.flagged) {
      const fl = 0.5 + 0.5 * Math.sin(time * 6 + p.ph);
      ctx.fillStyle = `rgba(255,77,94,${0.35 + fl * 0.45})`;
      ctx.beginPath(); ctx.arc(scr.x, scr.y, r + 4 + fl * 2.5, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = p.type.color;
    ctx.beginPath(); ctx.arc(scr.x, scr.y, r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawLoose(time) {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const p of loose) {
    const r = p.type.size;
    if (p.type.flagged) {
      const fl = 0.5 + 0.5 * Math.sin(time * 7 + p.ph);
      ctx.fillStyle = `rgba(255,77,94,${0.30 + fl * 0.35})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, r + 5 + fl * 3, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = p.type.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, TAU); ctx.fill();
    // motion streak
    ctx.strokeStyle = p.type.color;
    ctx.globalAlpha = 0.28;
    ctx.lineWidth = r * 0.9;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x - p.vx * 0.03, p.y - p.vy * 0.03);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function drawFrags() {
  if (!frags.length) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const f of frags) {
    const k = 1 - f.t / f.life;
    ctx.globalAlpha = k;
    ctx.fillStyle = f.c;
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (0.35 + k * 0.65), 0, TAU); ctx.fill();
  }
  ctx.restore();
}

function drawFx() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const f of fx) {
    const k = f.t / f.dur;
    if (f.k === 'ring') {
      ctx.strokeStyle = `rgba(126,224,255,${(1 - k) * 0.8})`;
      ctx.lineWidth = 2.5 * (1 - k) + 0.5;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r * easeOut(k), 0, TAU); ctx.stroke();
      ctx.fillStyle = `rgba(220,250,255,${(1 - k) * 0.5})`;
      ctx.beginPath(); ctx.arc(f.x, f.y, 9 * (1 - k), 0, TAU); ctx.fill();
    } else if (f.k === 'cap') {
      ctx.strokeStyle = f.c;
      ctx.globalAlpha = (1 - k) * 0.9;
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(f.x, f.y, 4 + 18 * easeOut(k), 0, TAU); ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }
  ctx.restore();
}

function drawLaser(time) {
  const c = L.ch;
  if (!pointer.inside || pointer.x < c.x || pointer.x > c.x + c.w) return;

  const beamOn = pointer.down && laser.lock <= 0;
  const flash = laser.beamT;
  if (!beamOn && flash <= 0) return;

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const e of L.emitters) {
    const dx = pointer.x - e.x, dy = pointer.y - e.y;
    const len = Math.hypot(dx, dy) || 1;
    // each beam runs past the focus, so you can see all four cross
    const ox = e.x + dx / len * (len + 110), oy = e.y + dy / len * (len + 110);
    if (beamOn) {
      ctx.strokeStyle = 'rgba(126,224,255,0.20)';
      ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(ox, oy); ctx.stroke();
    }
    if (flash > 0) {
      ctx.strokeStyle = 'rgba(190,240,255,' + flash * 0.8 + ')';
      ctx.lineWidth = 1 + flash * 3;
      ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(ox, oy); ctx.stroke();
    }
  }

  // the focus, the only place the four beams add up to anything
  const focus = beamOn ? 0.75 : flash;
  const fr = beamOn ? BEAM_RADIUS * 0.8 : PULSE_RADIUS * (0.7 + flash * 0.6);
  const gr = ctx.createRadialGradient(pointer.x, pointer.y, 0, pointer.x, pointer.y, fr);
  gr.addColorStop(0, 'rgba(226,250,255,' + 0.55 * focus + ')');
  gr.addColorStop(0.35, 'rgba(126,224,255,' + 0.17 * focus + ')');
  gr.addColorStop(1, 'rgba(126,224,255,0)');
  ctx.fillStyle = gr;
  ctx.beginPath(); ctx.arc(pointer.x, pointer.y, fr, 0, TAU); ctx.fill();
  ctx.restore();

  if (beamOn) {
    ctx.strokeStyle = 'rgba(126,224,255,0.30)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(pointer.x, pointer.y, BEAM_RADIUS, 0, TAU); ctx.stroke();
  }
}

// The Clock of the Long Now, as faithfully as a HUD dial can manage.
//
// The real one has six dials: year, century, horizons, sun position, lunar
// phase, and the stars of the night sky. The star field sits at the centre and
// carries both the sidereal day and the precession of the zodiac. The sun and
// moon ride outside it, the moon showing its phase in 32 discrete steps through
// an opening. The year reads in five digits, 02026, so there is no Y10K
// problem. It is five hundred feet down a shaft in a West Texas mountain.
//
// The scan window is laid on the outermost ring as the countdown, which is the
// one thing here the real clock would find hilariously short.
function drawClock(cx, cy, r, frac, secs, time) {
  ctx.save();
  ctx.fillStyle = 'rgba(6,11,15,0.94)';
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.fill();

  // the star field: sidereal turn, with a far slower precession on top
  const spin = time * 0.05 + year * 0.02;
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, r * 0.42, 0, TAU); ctx.clip();
  ctx.fillStyle = '#050c11';
  ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
  for (let i = 0; i < 40; i++) {
    const a = i * 2.39996 + spin;               // golden angle, so they scatter
    const rr = r * 0.40 * Math.sqrt(((i * 7) % 17) / 17);
    const b = 0.35 + 0.65 * (((i * 5) % 4) / 4);
    ctx.fillStyle = 'rgba(196,228,255,' + b * 0.85 + ')';
    ctx.beginPath();
    ctx.arc(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr, b * 1.1 + 0.35, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
  ctx.strokeStyle = COL.rule;
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(cx, cy, r * 0.42, 0, TAU); ctx.stroke();

  // sun position, and the moon showing its phase in 32 steps
  const orbit = r * 0.58;
  const sunA = -Math.PI / 2 + time * 0.30;
  const sx = cx + Math.cos(sunA) * orbit, sy = cy + Math.sin(sunA) * orbit;
  ctx.fillStyle = COL.teal;
  ctx.beginPath(); ctx.arc(sx, sy, 3.2, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(53,224,208,0.45)';
  ctx.beginPath(); ctx.arc(sx, sy, 6, 0, TAU); ctx.stroke();

  const moonA = sunA + 2.2 + time * 0.045;
  const mx = cx + Math.cos(moonA) * orbit, my = cy + Math.sin(moonA) * orbit;
  const phase = Math.floor(((time * 0.035) % 1) * 32) / 32;
  ctx.save();
  ctx.beginPath(); ctx.arc(mx, my, 4.8, 0, TAU); ctx.clip();
  ctx.fillStyle = '#0a1218';
  ctx.fillRect(mx - 7, my - 7, 14, 14);
  ctx.fillStyle = '#c8dbe4';
  ctx.beginPath(); ctx.arc(mx + (phase - 0.5) * 11.5, my, 4.8, 0, TAU); ctx.fill();
  ctx.restore();
  ctx.strokeStyle = COL.rule;
  ctx.beginPath(); ctx.arc(mx, my, 4.8, 0, TAU); ctx.stroke();

  // the horizon ring, day above and night below
  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(53,224,208,0.16)';
  ctx.beginPath(); ctx.arc(cx, cy, r * 0.74, Math.PI, TAU); ctx.stroke();
  ctx.strokeStyle = 'rgba(120,150,170,0.09)';
  ctx.beginPath(); ctx.arc(cx, cy, r * 0.74, 0, Math.PI); ctx.stroke();

  // the tick ring
  ctx.lineWidth = 1;
  for (let i = 0; i < 60; i++) {
    const a = i / 60 * TAU - Math.PI / 2;
    const big = i % 5 === 0;
    const r0 = r * (big ? 0.83 : 0.86), r1 = r * 0.90;
    ctx.strokeStyle = big ? 'rgba(53,224,208,0.45)' : COL.rule;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
    ctx.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
    ctx.stroke();
  }

  // the scan window, draining the outer dial
  ctx.lineWidth = 4;
  ctx.strokeStyle = COL.rule;
  ctx.beginPath(); ctx.arc(cx, cy, r - 3, 0, TAU); ctx.stroke();
  ctx.strokeStyle = frac < 0.25 ? COL.red : COL.cyan;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(cx, cy, r - 3, -Math.PI / 2, -Math.PI / 2 + Math.max(0.001, frac) * TAU);
  ctx.stroke();
  ctx.lineCap = 'butt';

  // the countdown itself, over the stars
  ctx.textAlign = 'center';
  ctx.fillStyle = frac < 0.25 ? COL.red : COL.text;
  ctx.font = '600 ' + Math.round(r * 0.52) + 'px ui-monospace, Menlo, monospace';
  ctx.fillText(secs.toFixed(1), cx, cy + r * 0.19);

  // and the year, in five digits, outside everything
  ctx.fillStyle = COL.teal;
  ctx.font = Math.round(r * 0.26) + 'px ui-monospace, Menlo, monospace';
  ctx.fillText('0' + year, cx, cy + r + Math.round(r * 0.32));
  ctx.fillStyle = COL.dim;
  ctx.font = Math.round(r * 0.19) + 'px ui-monospace, Menlo, monospace';
  ctx.fillText('LONG NOW YEAR', cx, cy + r + Math.round(r * 0.56));
  ctx.textAlign = 'left';
  ctx.restore();
}

function drawCursor() {
  const c = L.ch;
  if (pointer.x < c.x || pointer.x > c.x + c.w) return;
  const locked = laser.lock > 0;
  ctx.strokeStyle = locked ? COL.red : (laser.onBody ? COL.cyan : COL.tealDim);
  ctx.lineWidth = 1;
  const r = PULSE_RADIUS;
  ctx.globalAlpha = locked ? 0.5 : 0.75;
  ctx.beginPath(); ctx.arc(pointer.x, pointer.y, r, 0, TAU); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(pointer.x - 9, pointer.y); ctx.lineTo(pointer.x - 3, pointer.y);
  ctx.moveTo(pointer.x + 3, pointer.y); ctx.lineTo(pointer.x + 9, pointer.y);
  ctx.moveTo(pointer.x, pointer.y - 9); ctx.lineTo(pointer.x, pointer.y - 3);
  ctx.moveTo(pointer.x, pointer.y + 3); ctx.lineTo(pointer.x, pointer.y + 9);
  ctx.stroke();
  ctx.globalAlpha = 1;
}

// ---------------------------------------------------------------- panels

function label(text, x, y, size) {
  ctx.fillStyle = COL.dim;
  ctx.font = ((size || 11) * L.hud) + 'px ui-monospace, Menlo, monospace';
  ctx.fillText(text, x, y);
}
function value(text, x, y, size, color) {
  ctx.fillStyle = color || COL.text;
  ctx.font = (size * L.hud) + 'px ui-monospace, Menlo, monospace';
  ctx.fillText(text, x, y);
}
function bar(x, y, w, h, frac, color) {
  ctx.fillStyle = '#0d1418';
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w * clamp(frac, 0, 1), h);
  ctx.strokeStyle = COL.rule;
  ctx.lineWidth = 1;
  ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
}
function strikeDots(x, y, r) {
  for (let i = 0; i < MAX_MISSES; i++) {
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = i < misses ? COL.red : COL.rule;
    ctx.fillStyle = COL.red;
    ctx.beginPath(); ctx.arc(x + r + i * (r * 2 + 9), y, r, 0, TAU);
    if (i < misses) ctx.fill();
    ctx.stroke();
  }
}
function heatColor() {
  return laser.lock > 0 ? COL.red : (laser.heat > 75 ? COL.cyan : COL.teal);
}
function scanFrac() {
  const tLeft = subject && subject.phase === 'scan' ? subject.scanLeft
              : (subject ? subject.scanTime : 0);
  return { tLeft, frac: subject ? clamp(tLeft / subject.scanTime, 0, 1) : 0 };
}

// "Am I supposed to click all the dots, or just the red ones?" is a fair
// question that the title card was answering two minutes too early.
function drawGoal(time) {
  const c = L.ch;
  const sc = scanFrac();
  const k = L.clock;
  if (!L.narrow) drawClock(k.cx, k.cy, k.r, sc.frac, sc.tLeft, time);

  if (state !== 'play' || !subject) return;
  const y = (L.narrow ? L.topH : k.cy + k.r) + 46;
  ctx.textAlign = 'center';
  const left = subject.parts.filter(p => p.type.flagged).length +
               loose.filter(p => p.type.flagged).length;
  if (left > 0) {
    value(left + ' RED LEFT ON THIS SUBJECT, THOSE ARE THE ONES THAT COUNT',
          c.cx, y, 15, COL.red);
  } else {
    value('ALL RED RECOVERED, SWEEP THE REST FOR POINTS', c.cx, y, 15, COL.teal);
  }
  value('TAP THE BODY TO KNOCK PARTICLES OFF, THEN HOLD AND DRAG THEM TO THE INTAKE',
        c.cx, y + 21, 12, COL.dim);
  ctx.textAlign = 'left';
}

function drawPanels(time) {
  if (L.narrow) { drawBars(time); return; }

  const lp = L.left, rp = L.right;
  ctx.fillStyle = COL.panel;
  ctx.fillRect(0, 0, lp.w, H);
  ctx.fillRect(rp.x, 0, rp.w, H);
  ctx.strokeStyle = COL.rule;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(lp.w + .5, 0); ctx.lineTo(lp.w + .5, H);
  ctx.moveTo(rp.x + .5, 0); ctx.lineTo(rp.x + .5, H);
  ctx.stroke();

  const x = 20, bw = lp.w - 40;
  let y = 40;
  ctx.textAlign = 'left';
  label('PARTICLE RECOVERY UNIT 04', x, y, 11); y += 30;

  label('SCORE', x, y); y += 32;
  value(String(score).padStart(6, '0'), x, y, 31, COL.text); y += 36;

  label('SHIFT', x, y); y += 27;
  value(String(shift).padStart(2, '0'), x, y, 22, COL.text); y += 34;

  label('EMITTER HEAT', x, y); y += 15;
  bar(x, y, bw, 10, laser.heat / 100, heatColor());
  y += 26;
  if (laser.lock > 0) value('OVERHEAT. COOLING.', x, y, 13, COL.red);
  y += 24;

  label('SCAN WINDOW', x, y); y += 26;
  const sc = scanFrac();
  value(sc.tLeft.toFixed(1) + ' s', x, y, 20, sc.frac < 0.25 ? COL.red : COL.text);
  y += 40;

  label('FLAGGED LOST', x, y); y += 24;
  strikeDots(x, y, 9);
  y += 42;

  label('SUBJECT', x, y); y += 24;
  value(subject && state === 'play' ? subject.id : 'STANDBY', x, y, 17, COL.text);

  // ---- right panel, the analysis feed
  const rx = rp.x + 20;
  let ry = 40;
  value('ANALYSIS FEED', rx, ry, 16, COL.teal); ry += 19;
  label('CAPTURE MECHANISM 1', rx, ry, 11); ry += 28;
  ctx.strokeStyle = COL.rule;
  ctx.beginPath(); ctx.moveTo(rx, ry - 11); ctx.lineTo(W - 20, ry - 11); ctx.stroke();
  ry += 8;

  if (feed.length === 0) label('AWAITING SAMPLE', rx, ry);
  for (const f of feed) {
    if (ry > H - 140) break;
    ctx.globalAlpha = clamp(1 - (f.age - 8) / 6, 0.3, 1);
    if (f.warn || f.ok) {
      const col = f.warn ? COL.red : COL.teal;
      ctx.fillStyle = col;
      ctx.fillRect(rx, ry - 10, 8, 8);
      value(f.text, rx + 18, ry, 14, col);
    } else {
      ctx.fillStyle = f.type.color;
      ctx.beginPath(); ctx.arc(rx + 4, ry - 5, 4.5, 0, TAU); ctx.fill();
      value(f.type.name, rx + 18, ry, 14, f.type.flagged ? COL.red : COL.text);
      if (f.n > 1) {
        ctx.textAlign = 'right';
        value('x' + f.n, W - 20, ry, 14, COL.dim);
        ctx.textAlign = 'left';
      }
      if (f.type.flagged) { ry += 17; value('FLAGGED FOR ANALYSIS', rx + 18, ry, 11.5, COL.red); }
    }
    ry += 28;
    ctx.globalAlpha = 1;
  }

  const fy = H - 108;
  ctx.strokeStyle = COL.rule;
  ctx.beginPath(); ctx.moveTo(rx, fy - 22); ctx.lineTo(W - 20, fy - 22); ctx.stroke();
  const rate = released > 0 ? Math.round(captured / released * 100) : 0;
  const rows = [
    ['DISLODGED', String(released), COL.text],
    ['CAPTURED', String(captured), COL.text],
    ['RECOVERY', rate + ' %', rate >= 60 ? COL.teal : COL.cyan],
  ];
  rows.forEach((r, i) => {
    label(r[0], rx, fy + i * 26);
    ctx.textAlign = 'right'; value(r[1], W - 20, fy + i * 26, 15, r[2]); ctx.textAlign = 'left';
  });
}

// phone layout: two bars laid over the chamber, nothing smaller than 12px
function drawBars(time) {
  const pad = 15;
  ctx.fillStyle = 'rgba(6,10,13,0.90)';
  ctx.fillRect(0, 0, W, L.topH);
  ctx.strokeStyle = COL.rule;
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, L.topH + .5); ctx.lineTo(W, L.topH + .5); ctx.stroke();

  ctx.textAlign = 'left';
  label('SCORE', pad, 26, 12);
  value(String(score).padStart(6, '0'), pad, 58, 27, COL.text);

  const sc = scanFrac();
  const k = L.clock;
  drawClock(k.cx, k.cy, k.r, sc.frac, sc.tLeft, time);

  ctx.textAlign = 'right';
  label('SHIFT ' + String(shift).padStart(2, '0'), W - pad, 26, 12);
  ctx.textAlign = 'left';
  strikeDots(W - pad - 58, 50, 8);

  bar(pad, L.topH - 20, W - pad * 2, 10, laser.heat / 100, heatColor());
  ctx.textAlign = 'center';
  label(laser.lock > 0 ? 'OVERHEAT. COOLING.' : 'EMITTER HEAT', W / 2, L.topH - 27, 12);
  ctx.textAlign = 'left';

  // bottom bar: what the analyser last saw, and how much you are keeping
  const by = H - L.botH;
  ctx.fillStyle = 'rgba(6,10,13,0.90)';
  ctx.fillRect(0, by, W, L.botH);
  ctx.strokeStyle = COL.rule;
  ctx.beginPath(); ctx.moveTo(0, by + .5); ctx.lineTo(W, by + .5); ctx.stroke();

  const top = feed[0];
  label('ANALYSIS', pad, by + 24, 12);
  if (!top) {
    value('AWAITING SAMPLE', pad, by + 50, 15, COL.dim);
  } else if (top.warn || top.ok) {
    value(top.text, pad, by + 50, 15, top.warn ? COL.red : COL.teal);
  } else {
    ctx.fillStyle = top.type.color;
    ctx.beginPath(); ctx.arc(pad + 5, by + 45, 5, 0, TAU); ctx.fill();
    value(top.type.name + (top.n > 1 ? ' x' + top.n : ''), pad + 19, by + 50, 15,
          top.type.flagged ? COL.red : COL.text);
  }
  const rate = released > 0 ? Math.round(captured / released * 100) : 0;
  ctx.textAlign = 'right';
  label('RECOVERY', W - pad, by + 24, 12);
  value(rate + ' %', W - pad, by + 50, 20, rate >= 60 ? COL.teal : COL.cyan);
  ctx.textAlign = 'left';
}

const OVERLAY = 'rgba(4,7,10,0.93)';

function card(title, titleColor, sub, lines, button, accent) {
  const c = L.ch;
  ctx.fillStyle = OVERLAY;
  ctx.fillRect(c.x, 0, c.w, H);
  ctx.textAlign = 'center';

  // absolute sizes, so the card cannot compound with the HUD scale
  const k = clamp(Math.min(W, H) / 720, 0.82, 1.35);
  const put = (t, y, size, color, weight) => {
    ctx.fillStyle = color;
    ctx.font = (weight ? weight + ' ' : '') + (size * k) + 'px ui-monospace, Menlo, monospace';
    ctx.fillText(t, c.cx, y);
  };

  const bw = Math.min(c.w * 0.62, 280 * k), bh = 56 * k;
  const block = 46 * k + 26 * k + bh + 44 * k + lines.length * 27 * k;
  let y = Math.max(44 * k, (H - block) / 2) + 34 * k;

  put(title, y, Math.min(44, c.w * 0.1), titleColor, '600'); y += 24 * k;
  put(sub, y, 13, COL.dim); y += 30 * k;

  const bx = c.cx - bw / 2;
  const pulse = 0.6 + 0.4 * Math.sin(performance.now() / 420);
  ctx.fillStyle = 'rgba(126,224,255,' + (0.08 + pulse * 0.07) + ')';
  ctx.fillRect(bx, y, bw, bh);
  ctx.strokeStyle = accent;
  ctx.lineWidth = 2;
  ctx.strokeRect(bx + 1, y + 1, bw - 2, bh - 2);
  put(button, y + bh / 2 + 7 * k, 19, accent, '700');
  y += bh + 40 * k;

  for (const t of lines) { put(t, y, 14, COL.dim); y += 27 * k; }
  ctx.textAlign = 'left';
}

function drawTitle() {
  card('DUST OFF', COL.teal, 'LASER PARTICLE RECOVERY', [
    'Tap the body. Four beams cross there and knock particles loose.',
    'Then hold and drag, and sweep them down into the intake.',
    'The red ones are the job. Everything else is points.',
  ], 'PLAY NOW', COL.teal);
}

function drawOver() {
  const rate = released > 0 ? Math.round(captured / released * 100) : 0;
  card('SHIFT ENDED', COL.red, 'THREE SUBJECTS LEFT UNCLEARED', [
    'Score ' + String(score).padStart(6, '0'),
    shift + ' subjects processed, ' + rate + ' per cent recovered',
    'Long now year 0' + year,
  ], 'RUN IT AGAIN', COL.teal);
}

// ---------------------------------------------------------------- loop

let last = performance.now();
function step(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw(now / 1000);
}
function frame(now) { step(now); requestAnimationFrame(frame); }
// Some embedded webviews throttle requestAnimationFrame to nothing. If frames
// stop arriving, keep the loop alive on a timer.
setInterval(() => { if (performance.now() - last > 40) step(performance.now()); }, 16);

layout();
subject = null;
requestAnimationFrame(frame);
})();
</script>
</body>
