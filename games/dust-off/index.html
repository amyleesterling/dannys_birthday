<script>
(() => {
'use strict';

// ---------------------------------------------------------------- constants

const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeIn = t => t * t * t;

const COL = {
  bg:       '#04070a',
  panel:    '#080d11',
  rule:     '#12262c',
  teal:     '#35e0d0',
  tealDim:  '#1a6f6c',
  text:     '#cfe6e6',
  dim:      '#4d6f74',
  cyan:     '#7ee0ff',   // --holo-cyan, the working accent
  red:      '#ff4d5e',
};

const TYPES = [
  { id: 'skin',   name: 'SKIN CELL',      color: '#d9c8a4', pts: 30, weight: 30, size: 2.2 },
  { id: 'dust',   name: 'DUST',           color: '#8d99a6', pts: 30, weight: 26, size: 2.0 },
  { id: 'lint',   name: 'LINT',           color: '#9fd4ff', pts: 45, weight: 18, size: 2.7 },
  { id: 'pollen', name: 'POLLEN',         color: '#ffd166', pts: 60, weight: 14, size: 2.5 },
  { id: 'bact',   name: 'BACTERIA',       color: '#93dd86', pts: 75, weight: 8,  size: 1.8 },
  { id: 'trace',  name: 'TRACE COMPOUND', color: '#ff4d5e', pts: 400, weight: 0, size: 3.6, flagged: true },
];
const TYPE_BY_ID = Object.fromEntries(TYPES.map(t => [t.id, t]));
const WEIGHT_TOTAL = TYPES.reduce((s, t) => s + t.weight, 0);

function pickType() {
  let r = Math.random() * WEIGHT_TOTAL;
  for (const t of TYPES) { r -= t.weight; if (r <= 0) return t; }
  return TYPES[0];
}

// laser + heat
const PULSE_HEAT   = 16;
const BEAM_HEAT    = 24;   // per second
const COOL_RATE    = 30;   // per second
const OVERHEAT_LOCK = 1.6; // seconds
const PULSE_RADIUS = 62;   // screen px
const BEAM_RADIUS  = 155;
const BEAM_FORCE   = 2800;

const MAX_MISSES = 3;

// how long the jacket takes to slide off screen once a round ends, before
// Danny fades in to dance through the rest of the result phase
const JACKET_EXIT = 0.4;
// the whole between-round interlude never runs longer than this, even if
// the move picked for the round runs longer; danny.cutCelebration() is what
// actually stops him when nextRound() outruns his dance
const MAX_INTERLUDE = 4.5;

// camera shake, in screen px. Ticks up on impact, decays every frame in
// update(). Capped per source so a flurry of taps cannot fling the world off
// screen.
const SHAKE_MAX = 16;
const kick = n => { shake = Math.min(SHAKE_MAX, shake + n); };

// ---------------------------------------------------------------- body model

// Local units: figure runs about y = -99 (crown) to y = +86 (soles).
function capsule(p, x1, y1, x2, y2, r) {
  const dx = x2 - x1, dy = y2 - y1;
  const len = Math.hypot(dx, dy);
  if (len < 1e-6) { p.moveTo(x1 + r, y1); p.arc(x1, y1, r, 0, TAU, true); return; }
  const a = Math.atan2(dy, dx);
  const nx = -dy / len, ny = dx / len;
  p.moveTo(x1 + nx * r, y1 + ny * r);
  p.lineTo(x2 + nx * r, y2 + ny * r);
  p.arc(x2, y2, r, a + Math.PI / 2, a - Math.PI / 2, true);
  p.lineTo(x1 - nx * r, y1 - ny * r);
  p.arc(x1, y1, r, a - Math.PI / 2, a + Math.PI / 2, true);
  p.closePath();
}

// A plain white sheet, cut to a jacket on a hanger: what's actually in the
// beams now. Every part is drawn with the same helper so the winding stays
// consistent and the nonzero fill unions them instead of punching holes.
// Kept inside the same local bounding box the old human silhouette used
// (crown-ish at -99, hem around 86) so nothing downstream that samples or
// positions this shape needed to change.
function buildJacket(pose) {
  const p = new Path2D();
  const splay = pose.armOut * 0.6;   // a little sleeve-to-sleeve variety
  // the hanger: a hook and the wire triangle it hangs from
  capsule(p, 0, -99, 0, -90, 2.2);
  capsule(p, 0, -90, -24, -76, 1.8);
  capsule(p, 0, -90, 24, -76, 1.8);
  // shoulders, just under the hanger
  capsule(p, -23, -75, 23, -75, 7);
  // the body panel, with a slight flare at the hem
  capsule(p, 0, -70, 0, 52, 25);
  capsule(p, 0, 46, 0, 60, 29);
  // sleeves, hanging straight down off each shoulder
  for (const s of [-1, 1]) {
    capsule(p, s * 27, -73, s * (30 + splay), 42, 10.5);
  }
  return p;
}

// Virtual Danny lives in danny.js and renders to his own offscreen canvas.
// He shows up between rounds now, not as the subject; this just says whether
// there's a model to draw at all.
const dannyOn = () => !!(window.Danny && window.Danny.ok && window.Danny.loaded);

// The wall mount the beams fire from. Drawn nose-first: the lens sits at
// (EMITTER_FX, EMITTER_FY) of the sprite, as a fraction of its width and
// height, and that point is what lands on the emitter's (x, y) in the
// chamber. A left-wall emitter draws as loaded; a right-wall one mirrors
// around the same lens point, so the beam still leaves from the right place.
// emitter-hot.png is the same render with the lens glow rechannelled from
// blue to red, swapped in while the emitter is locked out cooling down.
function loadArt(src) {
  const img = new Image();
  img.ready = false;
  img.onload = () => { img.ready = true; };
  img.src = src;
  return img;
}
const emitterImg = loadArt('emitter.png');
const emitterHotImg = loadArt('emitter-hot.png');
const EMITTER_FX = 0.744, EMITTER_FY = 0.276;

// The trace compound, the one flagged particle worth going after: Amy's
// glowing red specimen render in place of a plain dot. Rare enough (three a
// round, at most) that drawing the real image instead of a circle is cheap.
const traceImg = loadArt('trace.png');

// dedicated context for hit tests so the main transform is never disturbed
const hitCtx = document.createElement('canvas').getContext('2d');

// ---------------------------------------------------------------- audio

const audio = {
  ctx: null, muted: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) this.ctx = new AC();
  },
  tone(freq, freq2, dur, type, gain) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(30, freq2), t + dur);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(this.ctx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  },
  pulse()   { this.tone(880, 180, 0.11, 'sawtooth', 0.06); },
  capture() { this.tone(520, 900, 0.07, 'sine', 0.045); },
  flagged() { this.tone(300, 1300, 0.16, 'square', 0.05); },
  overheat(){ this.tone(160, 70, 0.3, 'square', 0.07); },
  miss()    { this.tone(220, 90, 0.35, 'triangle', 0.06); },
  arrive()  { this.tone(300, 460, 0.09, 'sine', 0.035); },
};

// ---------------------------------------------------------------- game state

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });

let W = 0, H = 0, dpr = 1;
let L = {};        // layout
let state = 'title';
let round = 0, score = 0, misses = 0, year = 2026;
let banner = null;
let captured = 0, released = 0;   // running totals for the report line

let subject = null;
let loose = [];
let fx = [];
let feed = [];
let shake = 0;
let frags = [];

const laser = { heat: 0, lock: 0, firing: false, x: 0, y: 0, onBody: false, beamT: 0 };
const pointer = { x: 0, y: 0, down: false, inside: false };

function layout() {
  const rect = canvas.getBoundingClientRect();
  dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.height * dpr);
  W = rect.width; H = rect.height;

  const narrow = W < 900;
  L = { narrow };

  if (narrow) {
    // on a phone the side panels become bars laid over the chamber
    L.left  = { x: 0, w: 0 };
    L.right = { x: W, w: 0 };
    L.ch    = { x: 0, y: 0, w: W, h: H };
    L.topH  = 198;
    L.botH  = 84;
    L.hud   = clamp(W / 300, 1.2, 1.8);
    L.floorY = H * 0.82;
    L.figH   = clamp(H * 0.44, 180, 420);
    L.clock  = { cx: W / 2, cy: 84, r: 50 };
  } else {
    const padL = W >= 1180 ? 272 : 236;
    const padR = W >= 1180 ? 304 : 252;
    L.left  = { x: 0, w: padL };
    L.right = { x: W - padR, w: padR };
    L.ch    = { x: padL, y: 0, w: W - padL - padR, h: H };
    L.topH  = 0; L.botH = 0;
    L.hud   = clamp(H / 660, 1.1, 1.45);
    L.floorY = H * 0.895;
    L.figH   = clamp(H * 0.62, 280, 560);
    L.clock  = { cx: L.ch.x + L.ch.w / 2, cy: 18 + 58, r: 58 };
  }

  L.ch.cx = L.ch.x + L.ch.w / 2;
  L.figScale = L.figH / 185;
  L.intake = { w: Math.min(480, L.ch.w * (narrow ? 0.76 : 0.56)), h: 24, y: L.floorY + 8 };
  // Two outlets per side wall, fixed, near the top. Four beams that cross at
  // the point you aim at, which is where the intensity finally gets high
  // enough to lift anything. Two photon, or four, since it is a birthday.
  const inset = L.ch.x + (narrow ? 17 : 30);
  const hiY = narrow ? L.topH + 32 : H * 0.10;
  const loY = hiY + H * (narrow ? 0.09 : 0.11);
  L.emitters = [
    { x: inset, y: hiY, s: 1 },
    { x: inset, y: loY, s: 1 },
    { x: L.ch.x + L.ch.w - (inset - L.ch.x), y: hiY, s: -1 },
    { x: L.ch.x + L.ch.w - (inset - L.ch.x), y: loY, s: -1 },
  ];
}

// ---------------------------------------------------------------- subject

// Particles climb faster than the clock does, which is the whole progression:
// the scan window itself caps out quickly, so more particles in the same
// six to eight seconds is what actually gets harder.
// roundTime caps out by round 11, so from there on the count is the only
// thing still climbing. Cap it high enough that skill runs out before the
// formula does.
const roundCount = n => Math.min(120, 8 + n * 4);
const roundTime  = n => Math.min(8, 6 + (n - 1) * 0.2);

function newSubject() {
  const pose = { armOut: rand(0, 5), stance: rand(0, 4) };
  const path = buildJacket(pose);
  const count = roundCount(round);
  // a trace compound turns up from round three, worth a lot, but the round is
  // cleared on recovering everything rather than on the red ones alone
  const flagCount = round >= 3 ? Math.min(3, Math.floor(round / 3)) : 0;

  // rejection sample points inside the silhouette, in local units
  const pts = [];
  let guard = 0;
  while (pts.length < count && guard < count * 300) {
    guard++;
    const x = rand(-34, 34), y = rand(-99, 86);
    if (!hitCtx.isPointInPath(path, x, y)) continue;
    pts.push({ x, y });
  }
  const parts = pts.map((pt, i) => ({
    lx: pt.x, ly: pt.y,
    type: i < flagCount ? TYPE_BY_ID.trace : pickType(),
    ph: rand(0, TAU),
  }));
  for (let i = parts.length - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    [parts[i], parts[j]] = [parts[j], parts[i]];
  }

  const t = roundTime(round);
  return {
    path, pose, parts,
    id: 'SB' + String(1740 + round * 7 + ((Math.random() * 60) | 0)).padStart(4, '0'),
    phase: 'ready', t: 0,
    readyDur: 2.6, walkDur: 1.0, resultDur: 1.3,
    scanTime: t, scanLeft: t,
    total: parts.length, got: 0,
    x: L.ch.x - 70,
    turb: 0.30 + round * 0.05,
  };
}

function subjectTransform(s) {
  return { x: s.x, y: L.floorY - L.figH * (86 / 185), s: L.figScale };
}
function toScreen(s, lx, ly) {
  const t = subjectTransform(s);
  return { x: t.x + lx * t.s, y: t.y + ly * t.s };
}
function toLocal(s, sx, sy) {
  const t = subjectTransform(s);
  return { x: (sx - t.x) / t.s, y: (sy - t.y) / t.s };
}

// ---------------------------------------------------------------- particles

function dislodge(sx, sy, radius) {
  if (!subject) return 0;
  const t = subjectTransform(subject);
  const rLocal = radius / t.s;
  let n = 0;
  for (let i = subject.parts.length - 1; i >= 0; i--) {
    const p = subject.parts[i];
    const d = Math.hypot(p.lx - (sx - t.x) / t.s, p.ly - (sy - t.y) / t.s);
    if (d > rLocal) continue;
    const scr = toScreen(subject, p.lx, p.ly);
    const ang = Math.atan2(scr.y - sy, scr.x - sx) + rand(-0.5, 0.5);
    const sp = rand(70, 190) * (1 - d / rLocal * 0.55);
    loose.push({
      x: scr.x, y: scr.y,
      vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - rand(20, 70),
      type: p.type, ph: rand(0, TAU), age: 0,
    });
    shatter(scr.x, scr.y, p.type.color, 5, 120);
    subject.parts.splice(i, 1);
    n++;
  }
  return n;
}

// Particles come apart rather than blinking out. Small burst when the beams
// knock one off the subject, a proper one when the analyser takes it.
function shatter(x, y, color, n, speed) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), sp = rand(speed * 0.3, speed);
    frags.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - rand(0, speed * 0.2),
      r: rand(0.7, 2.2), c: color, t: 0, life: rand(0.25, 0.62),
    });
  }
}

function capture(p) {
  shatter(p.x, p.y, p.type.color, p.type.flagged ? 26 : 15,
          p.type.flagged ? 300 : 210);
  score += p.type.pts;
  captured++;
  addFeed(p.type);
  fx.push({ k: 'cap', x: p.x, y: p.y, t: 0, dur: 0.35, c: p.type.color });
  if (subject) subject.got++;
  if (p.type.flagged) audio.flagged();
  else audio.capture();
}

function addFeed(type) {
  const top = feed[0];
  if (top && top.type === type && top.age < 2.5) { top.n++; top.age = 0; return; }
  feed.unshift({ type, n: 1, age: 0 });
  if (feed.length > 9) feed.length = 9;
}

// ---------------------------------------------------------------- input

function fire() {
  if (laser.lock > 0 || state !== 'play') return;
  const { x, y } = pointer;
  if (x < L.ch.x || x > L.ch.x + L.ch.w) return;

  laser.heat += PULSE_HEAT;
  laser.beamT = 1;
  audio.pulse();
  fx.push({ k: 'ring', x, y, t: 0, dur: 0.3, r: PULSE_RADIUS });
  kick(2);

  const n = subject ? dislodge(x, y, PULSE_RADIUS) : 0;
  released += n;
  if (n) kick(n * 1.4);

  if (laser.heat >= 100) {
    laser.heat = 100;
    laser.lock = OVERHEAT_LOCK;
    audio.overheat();
    kick(10);
  }
}

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  updatePointer(e);
  audio.init();
  pointer.down = true;
  if (state === 'title') { startRun(); return; }
  if (state === 'over')  { startRun(); return; }
  fire();
});
canvas.addEventListener('pointermove', updatePointer);
canvas.addEventListener('pointerup', () => { pointer.down = false; });
canvas.addEventListener('pointercancel', () => { pointer.down = false; });
canvas.addEventListener('pointerenter', () => { pointer.inside = true; });
canvas.addEventListener('pointerleave', () => { pointer.inside = false; pointer.down = false; });

function updatePointer(e) {
  const r = canvas.getBoundingClientRect();
  pointer.x = e.clientX - r.left;
  pointer.y = e.clientY - r.top;
  pointer.inside = true;
}

window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'r') { audio.init(); startRun(); }
  if (k === 'm') { audio.init(); audio.muted = !audio.muted; }
});
window.addEventListener('resize', () => { layout(); });

// ---------------------------------------------------------------- run

function startRun() {
  layout();
  round = 1; score = 0; misses = 0; captured = 0; released = 0; year = 2026;
  banner = null;
  loose = []; fx = []; feed = []; frags = [];
  laser.heat = 0; laser.lock = 0; laser.beamT = 0;
  subject = newSubject();
  audio.arrive();
  state = 'play';
}

function settleRound() {
  year++;
  const s = subject;
  const cleared = s.got >= s.total;
  if (cleared) {
    const bonus = 200 * round + Math.round(s.scanLeft * 40);
    score += bonus;
    banner = { text: 'ALL RECOVERED', sub: '+' + bonus, ok: true, t: 0 };
    feed.unshift({ ok: true, text: 'ROUND ' + round + ' CLEARED', age: 0 });
    audio.flagged();
    kick(6);
  } else {
    misses++;
    banner = { text: 'MISSED ' + (s.total - s.got), sub: 'RECOVER EVERY ONE', ok: false, t: 0 };
    feed.unshift({ warn: true, text: (s.total - s.got) + ' LEFT ON SUBJECT', age: 0 });
    audio.miss();
    kick(13);
  }
  if (feed.length > 9) feed.length = 9;

  // Danny takes the stage between every round, cleared or missed alike: the
  // dance is the transition to the next one, not a reward for this one.
  // celebrate() picks a move by round number and says how long it runs, but
  // a couple of the sillier ones run well past the 6-8s round they'd be
  // bridging, so the interlude itself is capped and nextRound() cuts the
  // dance short rather than let a long one drag the pace down.
  const dur = dannyOn() ? window.Danny.celebrate(round) : 0;
  s.resultDur = Math.min(MAX_INTERLUDE,
    Math.max(JACKET_EXIT + 0.6, JACKET_EXIT + (dur || 0) + 0.4));
}

function nextRound() {
  loose = []; frags = [];
  if (window.Danny && window.Danny.ok) window.Danny.cutCelebration();
  if (misses >= MAX_MISSES) { state = 'over'; return; }
  round++;
  subject = newSubject();
}

// ---------------------------------------------------------------- update

function update(dt) {
  shake *= Math.pow(0.02, dt);
  for (let i = fx.length - 1; i >= 0; i--) {
    fx[i].t += dt;
    if (fx[i].t > fx[i].dur) fx.splice(i, 1);
  }
  const fdrag = Math.pow(0.04, dt);
  for (let i = frags.length - 1; i >= 0; i--) {
    const f = frags[i];
    f.t += dt;
    f.x += f.vx * dt; f.y += f.vy * dt;
    f.vx *= fdrag; f.vy *= fdrag;
    if (f.t >= f.life) frags.splice(i, 1);
  }
  for (const f of feed) f.age += dt;

  laser.beamT = Math.max(0, laser.beamT - dt * 5);
  laser.onBody = false;

  if (state !== 'play') {
    if (window.Danny && window.Danny.ok) {
      window.Danny.setMotion('idle');
      window.Danny.update(dt, 0);
    }
    updateLoose(dt, 0.4);
    return;
  }

  // heat
  if (laser.lock > 0) {
    laser.lock -= dt;
    laser.heat = Math.max(0, laser.heat - dt * (100 / OVERHEAT_LOCK));
  } else if (pointer.down && pointer.inside) {
    laser.heat += BEAM_HEAT * dt;
    if (laser.heat >= 100) { laser.heat = 100; laser.lock = OVERHEAT_LOCK; audio.overheat(); kick(10); }
  } else {
    laser.heat = Math.max(0, laser.heat - COOL_RATE * dt);
  }

  const beamOn = pointer.down && pointer.inside && laser.lock <= 0 &&
                 pointer.x > L.ch.x && pointer.x < L.ch.x + L.ch.w;

  if (window.Danny && window.Danny.ok) {
    // idle and out of the way until settleRound() calls celebrate() for him
    window.Danny.setMotion('idle');
    window.Danny.update(dt, clamp((pointer.x - L.ch.cx) / 300, -0.8, 0.8));
  }

  // ready, scan, result. The jacket slides in under the three two one, so the
  // clock only starts once it is hanging in the beams.
  const s = subject;
  const wasCount = s.phase === 'ready' ? Math.ceil(s.readyDur - s.t) : 0;
  s.t += dt;
  if (s.phase === 'ready') {
    const k = easeOut(clamp(s.t / s.walkDur, 0, 1));
    s.x = lerp(L.ch.x - 70, L.ch.cx, k);
    const now = Math.ceil(s.readyDur - s.t);
    if (now !== wasCount && now >= 0 && now <= 3) audio.arrive();
    if (s.t >= s.readyDur) { s.phase = 'scan'; s.t = 0; s.x = L.ch.cx; }
  } else if (s.phase === 'scan') {
    s.x = L.ch.cx + Math.sin(s.t * 1.4) * 1.6;
    s.scanLeft -= dt;
    if (s.scanLeft <= 0 || (s.parts.length === 0 && loose.length === 0)) {
      s.scanLeft = Math.max(0, s.scanLeft);
      settleRound();
      s.phase = 'result'; s.t = 0;
    }
  } else {
    // the jacket slides off quickly; Danny takes over the screen for the
    // rest of the result phase, so his position doesn't ride on s.x at all
    const k = easeIn(clamp(s.t / JACKET_EXIT, 0, 1));
    s.x = lerp(L.ch.cx, L.ch.x + L.ch.w + 70, k);
    if (s.t >= s.resultDur) { nextRound(); return; }
  }

  // pointer over the body?
  if (s.phase !== 'exit') {
    const lp = toLocal(s, pointer.x, pointer.y);
    laser.onBody = hitCtx.isPointInPath(s.path, lp.x, lp.y);
  }

  // the beam keeps ablating while held
  if (beamOn) {
    // held, the beams strip whatever they pass over, so one sweep down the
    // body both knocks particles off and carries them to the intake
    const n = dislodge(pointer.x, pointer.y, PULSE_RADIUS * 0.85);
    released += n;
    if (n) kick(n * 1.1);
  }

  updateLoose(dt, s.turb, beamOn);
}

function updateLoose(dt, turb, beamOn) {
  const iw = L.intake.w, ix = L.ch.cx - iw / 2, iy = L.intake.y;
  const now = performance.now() / 1000;

  for (let i = loose.length - 1; i >= 0; i--) {
    const p = loose[i];
    p.age += dt;

    // buoyant drift plus a little turbulence: light debris rises out of frame
    let ax = Math.sin(now * 1.7 + p.ph * 3.1 + p.y * 0.012) * 26 * turb;
    let ay = -7 - (p.type.flagged ? -4 : 0);

    if (beamOn) {
      const dx = pointer.x - p.x, dy = pointer.y - p.y;
      const d = Math.hypot(dx, dy);
      if (d < BEAM_RADIUS) {
        const f = BEAM_FORCE * (1 - d / BEAM_RADIUS);
        ax += dx / (d + 1) * f;
        ay += dy / (d + 1) * f;
      }
    }

    // intake suction near the vent mouth
    const overVent = p.x > ix - 70 && p.x < ix + iw + 70 && p.y > iy - 300;
    if (overVent) {
      ay += 520 * (1 - clamp((iy - p.y) / 300, 0, 1));
      ax += ((ix + iw / 2) - p.x) * 1.2;
    }

    p.vx += ax * dt; p.vy += ay * dt;
    const drag = Math.pow(0.06, dt);
    p.vx *= drag; p.vy *= drag;
    p.x += p.vx * dt; p.y += p.vy * dt;

    // captured
    if (p.y >= iy && p.x > ix && p.x < ix + iw) { capture(p); loose.splice(i, 1); continue; }

    // floor bounce, so nothing gets stranded outside the vent
    if (p.y > L.floorY + 4 && !(p.x > ix && p.x < ix + iw)) {
      p.y = L.floorY + 4; p.vy = -Math.abs(p.vy) * 0.35;
    }
    // walls
    if (p.x < L.ch.x + 4) { p.x = L.ch.x + 4; p.vx = Math.abs(p.vx) * 0.4; }
    if (p.x > L.ch.x + L.ch.w - 4) { p.x = L.ch.x + L.ch.w - 4; p.vx = -Math.abs(p.vx) * 0.4; }

    // lost out of the top
    if (p.y < L.topH - 14) {   // on a phone they are gone once under the bar
      if (p.type.flagged) { /* counted at the end of the subject */ }
      loose.splice(i, 1);
    }
  }
}

// ---------------------------------------------------------------- draw

function draw(time) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = COL.bg;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  if (shake > 0.05) ctx.translate(rand(-shake, shake), rand(-shake, shake));
  drawChamber(time);
  if (subject && state !== 'title') drawSubject(subject, time);
  drawLoose(time);
  drawFrags();
  drawFx();
  if (state === 'play') drawLaser(time);
  ctx.restore();

  drawGoal(time);
  drawBeat(time);
  drawPanels(time);
  if (state === 'title') drawTitle();
  if (state === 'over') drawOver();
  if (state === 'play' && pointer.inside) drawCursor();
}

function drawChamber(time) {
  const c = L.ch;
  // back wall
  ctx.fillStyle = '#060b0f';
  ctx.fillRect(c.x, c.y, c.w, c.h);

  // floor grid
  ctx.save();
  ctx.beginPath(); ctx.rect(c.x, L.floorY, c.w, c.h - L.floorY + 30); ctx.clip();
  ctx.strokeStyle = 'rgba(53,224,208,0.10)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 12; i++) {
    const t = i / 12;
    const xTop = lerp(c.x + c.w * 0.30, c.x + c.w * 0.70, t);
    const xBot = lerp(c.x - c.w * 0.2, c.x + c.w * 1.2, t);
    ctx.beginPath(); ctx.moveTo(xTop, L.floorY); ctx.lineTo(xBot, c.h + 30); ctx.stroke();
  }
  for (let i = 1; i <= 7; i++) {
    const y = L.floorY + Math.pow(i / 7, 1.9) * (c.h - L.floorY + 30);
    ctx.beginPath(); ctx.moveTo(c.x, y); ctx.lineTo(c.x + c.w, y); ctx.stroke();
  }
  ctx.restore();

  // horizon
  ctx.strokeStyle = 'rgba(53,224,208,0.28)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(c.x, L.floorY + .5); ctx.lineTo(c.x + c.w, L.floorY + .5); ctx.stroke();

  // the four outlet housings, fixed to the side walls
  const hot = laser.lock > 0;
  const art = hot ? emitterHotImg : emitterImg;
  for (const e of L.emitters) {
    if (art.ready) {
      const ew = 108, eh = ew * (art.naturalHeight / art.naturalWidth);
      ctx.save();
      ctx.translate(e.x, e.y);
      if (e.s < 0) ctx.scale(-1, 1);
      ctx.drawImage(art, -EMITTER_FX * ew, -EMITTER_FY * eh, ew, eh);
      ctx.restore();
    } else {
      // the emitter art loads fast, but a plain housing covers the one frame it doesn't
      ctx.fillStyle = '#0b171b';
      ctx.strokeStyle = hot ? COL.red : COL.teal;
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(e.x - 9 * e.s, e.y - 13);
      ctx.lineTo(e.x - 9 * e.s, e.y + 13);
      ctx.lineTo(e.x + 11 * e.s, e.y + 7);
      ctx.lineTo(e.x + 11 * e.s, e.y - 7);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    // a little extra bloom on the lens itself, breathing gently, flickering
    // fast while it cools down
    const glow = hot ? '255,77,94' : '126,224,255';
    const pulse = 0.65 + 0.35 * Math.sin(time * (hot ? 10 : 2.4) + e.x * 0.1);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const gr = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, 15);
    gr.addColorStop(0, `rgba(${glow},${0.35 * pulse})`);
    gr.addColorStop(1, `rgba(${glow},0)`);
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(e.x, e.y, 15, 0, TAU); ctx.fill();
    ctx.restore();
  }

  // intake vent
  const iw = L.intake.w, ix = c.cx - iw / 2, iy = L.intake.y;
  const pulse = 0.5 + 0.5 * Math.sin(time * 2.2);
  ctx.fillStyle = '#020506';
  ctx.fillRect(ix, iy, iw, L.intake.h);
  ctx.strokeStyle = `rgba(53,224,208,${0.35 + pulse * 0.25})`;
  ctx.lineWidth = 1.5;
  ctx.strokeRect(ix + .5, iy + .5, iw - 1, L.intake.h - 1);
  ctx.save();
  ctx.beginPath(); ctx.rect(ix, iy, iw, L.intake.h); ctx.clip();
  ctx.strokeStyle = 'rgba(53,224,208,0.30)';
  ctx.lineWidth = 1;
  for (let x = ix - 20; x < ix + iw + 20; x += 9) {
    ctx.beginPath();
    ctx.moveTo(x + ((time * 26) % 9), iy);
    ctx.lineTo(x - 10 + ((time * 26) % 9), iy + L.intake.h);
    ctx.stroke();
  }
  ctx.restore();
  // suction haze
  const g = ctx.createLinearGradient(0, iy - 70, 0, iy);
  g.addColorStop(0, 'rgba(53,224,208,0)');
  g.addColorStop(1, `rgba(53,224,208,${0.05 + pulse * 0.04})`);
  ctx.fillStyle = g;
  ctx.fillRect(ix, iy - 70, iw, 70);

  ctx.fillStyle = COL.tealDim;
  ctx.font = `${10 * L.hud}px ui-monospace, Menlo, monospace`;
  ctx.textAlign = 'center';
  ctx.fillText('INTAKE', c.cx, iy + L.intake.h + 13);
  ctx.textAlign = 'left';
}

function drawSubject(s, time) {
  // The jacket fades fast once a round ends; Danny takes the rest of the
  // result phase to himself, at a fixed spot rather than riding s.x, since
  // he isn't the thing sliding off screen.
  if (s.phase === 'result') {
    const jacketAlpha = 1 - clamp(s.t / JACKET_EXIT, 0, 1);
    if (jacketAlpha > 0.01) drawJacket(s, time, jacketAlpha);
    if (s.t >= JACKET_EXIT && dannyOn()) {
      const danceAlpha = clamp((s.t - JACKET_EXIT) / 0.3, 0, 1);
      const f = window.Danny.frame;
      const cx = L.ch.cx, cy = L.floorY - L.figH * (86 / 185);
      const w = f.wLocal * L.figScale, h = f.hLocal * L.figScale;
      ctx.globalAlpha = danceAlpha;
      ctx.drawImage(window.Danny.canvas, cx - w / 2, cy - h / 2, w, h);
      ctx.globalAlpha = 1;
    }
    return;
  }
  drawJacket(s, time, 1);
}

function drawJacket(s, time, alpha) {
  const t = subjectTransform(s);
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(t.x, t.y);
  ctx.scale(t.s, t.s);
  ctx.lineWidth = 1.6 / t.s;

  // body fill
  ctx.fillStyle = 'rgba(20,58,64,0.55)';
  ctx.fill(s.path);

  // sensor scan lines inside the silhouette
  ctx.save();
  ctx.clip(s.path);
  ctx.strokeStyle = 'rgba(53,224,208,0.16)';
  ctx.lineWidth = 0.8 / t.s;
  const off = (time * 9) % 6;
  for (let y = -104; y < 92; y += 6) {
    ctx.beginPath(); ctx.moveTo(-40, y + off); ctx.lineTo(40, y + off); ctx.stroke();
  }
  // moving sensor bar
  const bar = -104 + ((time * 52) % 200);
  const bg = ctx.createLinearGradient(0, bar - 14, 0, bar + 14);
  bg.addColorStop(0, 'rgba(53,224,208,0)');
  bg.addColorStop(0.5, 'rgba(53,224,208,0.22)');
  bg.addColorStop(1, 'rgba(53,224,208,0)');
  ctx.fillStyle = bg;
  ctx.fillRect(-40, bar - 14, 80, 28);
  ctx.restore();

  // outline
  ctx.strokeStyle = laser.onBody ? '#7ff2e6' : COL.teal;
  ctx.stroke(s.path);
  ctx.restore();

  drawAttached(s, time, alpha);
}

// The flagged particle draws as the trace compound render instead of a
// dot, sized off the same radius its halo already breathes with.
function drawTrace(x, y, r, fl) {
  if (!traceImg.ready) {
    ctx.fillStyle = TYPE_BY_ID.trace.color;
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
    return;
  }
  const d = (r + 4 + fl * 2.5) * 2.2;
  ctx.drawImage(traceImg, x - d / 2, y - d / 2, d, d);
}

function drawAttached(s, time, alpha) {
  for (const p of s.parts) {
    const scr = toScreen(s, p.lx, p.ly);
    const r = p.type.size * (0.85 + 0.15 * Math.sin(time * 3 + p.ph));
    ctx.globalAlpha = alpha;
    if (p.type.flagged) {
      const fl = 0.5 + 0.5 * Math.sin(time * 6 + p.ph);
      ctx.fillStyle = `rgba(255,77,94,${0.35 + fl * 0.45})`;
      ctx.beginPath(); ctx.arc(scr.x, scr.y, r + 4 + fl * 2.5, 0, TAU); ctx.fill();
      drawTrace(scr.x, scr.y, r, fl);
    } else {
      ctx.fillStyle = p.type.color;
      ctx.beginPath(); ctx.arc(scr.x, scr.y, r, 0, TAU); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

function drawLoose(time) {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const p of loose) {
    const r = p.type.size;
    if (p.type.flagged) {
      const fl = 0.5 + 0.5 * Math.sin(time * 7 + p.ph);
      ctx.fillStyle = `rgba(255,77,94,${0.30 + fl * 0.35})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, r + 5 + fl * 3, 0, TAU); ctx.fill();
      drawTrace(p.x, p.y, r, fl);
    } else {
      ctx.fillStyle = p.type.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, TAU); ctx.fill();
    }
    // motion streak
    ctx.strokeStyle = p.type.color;
    ctx.globalAlpha = 0.28;
    ctx.lineWidth = r * 0.9;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x - p.vx * 0.03, p.y - p.vy * 0.03);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function drawFrags() {
  if (!frags.length) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const f of frags) {
    const k = clamp(1 - f.t / f.life, 0, 1);
    ctx.globalAlpha = k;
    ctx.fillStyle = f.c;
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (0.35 + k * 0.65), 0, TAU); ctx.fill();
  }
  ctx.restore();
}

function drawFx() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const f of fx) {
    const k = clamp(f.t / f.dur, 0, 1);
    if (f.k === 'ring') {
      ctx.strokeStyle = `rgba(126,224,255,${(1 - k) * 0.8})`;
      ctx.lineWidth = 2.5 * (1 - k) + 0.5;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r * easeOut(k), 0, TAU); ctx.stroke();
      ctx.fillStyle = `rgba(220,250,255,${(1 - k) * 0.5})`;
      ctx.beginPath(); ctx.arc(f.x, f.y, 9 * (1 - k), 0, TAU); ctx.fill();
    } else if (f.k === 'cap') {
      ctx.strokeStyle = f.c;
      ctx.globalAlpha = (1 - k) * 0.9;
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(f.x, f.y, 4 + 18 * easeOut(k), 0, TAU); ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }
  ctx.restore();
}

function drawLaser(time) {
  const c = L.ch;
  if (!pointer.inside || pointer.x < c.x || pointer.x > c.x + c.w) return;

  const beamOn = pointer.down && laser.lock <= 0;
  const flash = laser.beamT;
  if (!beamOn && flash <= 0) return;

  // scifi-ui .holosweep: a 14px band of --holo-beam at .55, glowing, carried
  // across on a 820ms cubic-bezier(.16, 1, .3, 1). Same band, same period,
  // running along the beam instead of down a panel.
  const BEAM = '178,216,248';
  const sweep = easeOut(((performance.now() % 820) / 820));

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const e of L.emitters) {
    const dx = pointer.x - e.x, dy = pointer.y - e.y;
    const len = Math.hypot(dx, dy) || 1;

    // the beam stops where you are aiming. It does not carry on past.
    if (beamOn) {
      ctx.strokeStyle = 'rgba(126,224,255,0.14)';
      ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(pointer.x, pointer.y); ctx.stroke();

      const band = 26 / len / 2;
      const g = ctx.createLinearGradient(e.x, e.y, pointer.x, pointer.y);
      const a = clamp(sweep - band, 0, 1), m = clamp(sweep, 0, 1), b = clamp(sweep + band, 0, 1);
      g.addColorStop(0, 'rgba(' + BEAM + ',0)');
      if (a > 0) g.addColorStop(a, 'rgba(' + BEAM + ',0)');
      g.addColorStop(m, 'rgba(' + BEAM + ',0.55)');
      if (b < 1) g.addColorStop(b, 'rgba(' + BEAM + ',0)');
      g.addColorStop(1, 'rgba(' + BEAM + ',0)');
      // the wide pass is the drop shadow the CSS version gets for free
      ctx.strokeStyle = g;
      ctx.lineWidth = 7;
      ctx.globalAlpha = 0.35;
      ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(pointer.x, pointer.y); ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(pointer.x, pointer.y); ctx.stroke();
    }

    if (flash > 0) {
      ctx.strokeStyle = 'rgba(126,224,255,' + flash * 0.30 + ')';
      ctx.lineWidth = 5 + flash * 7;
      ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(pointer.x, pointer.y); ctx.stroke();
    }
  }

  // the focus, kept small and dim enough that it does not wash the chamber out
  const focus = beamOn ? 0.30 : flash * 0.7;
  const fr = beamOn ? PULSE_RADIUS * 0.9 : PULSE_RADIUS * (0.5 + flash * 0.5);
  const gr = ctx.createRadialGradient(pointer.x, pointer.y, 0, pointer.x, pointer.y, fr);
  gr.addColorStop(0, 'rgba(180,235,255,' + 0.26 * focus + ')');
  gr.addColorStop(0.4, 'rgba(126,224,255,' + 0.12 * focus + ')');
  gr.addColorStop(1, 'rgba(126,224,255,0)');
  ctx.fillStyle = gr;
  ctx.beginPath(); ctx.arc(pointer.x, pointer.y, fr, 0, TAU); ctx.fill();
  ctx.restore();

  if (beamOn) {
    ctx.strokeStyle = 'rgba(126,224,255,0.22)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(pointer.x, pointer.y, BEAM_RADIUS, 0, TAU); ctx.stroke();
  }
}

// The Clock of the Long Now, as faithfully as a HUD dial can manage.
//
// The real one has six dials: year, century, horizons, sun position, lunar
// phase, and the stars of the night sky. The star field sits at the centre and
// carries both the sidereal day and the precession of the zodiac. The sun and
// moon ride outside it, the moon showing its phase in 32 discrete steps through
// an opening. The year reads in five digits, 02026, so there is no Y10K
// problem. It is five hundred feet down a shaft in a West Texas mountain.
//
// The scan window is laid on the outermost ring as the countdown, which is the
// one thing here the real clock would find hilariously short.
function drawClock(cx, cy, r, frac, secs, time) {
  ctx.save();
  ctx.fillStyle = 'rgba(6,11,15,0.94)';
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.fill();

  // the star field: sidereal turn, with a far slower precession on top
  const spin = time * 0.05 + year * 0.02;
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, r * 0.42, 0, TAU); ctx.clip();
  ctx.fillStyle = '#050c11';
  ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
  for (let i = 0; i < 40; i++) {
    const a = i * 2.39996 + spin;               // golden angle, so they scatter
    const rr = r * 0.40 * Math.sqrt(((i * 7) % 17) / 17);
    const b = 0.35 + 0.65 * (((i * 5) % 4) / 4);
    ctx.fillStyle = 'rgba(196,228,255,' + b * 0.85 + ')';
    ctx.beginPath();
    ctx.arc(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr, b * 1.1 + 0.35, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
  ctx.strokeStyle = COL.rule;
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(cx, cy, r * 0.42, 0, TAU); ctx.stroke();

  // sun position, and the moon showing its phase in 32 steps
  const orbit = r * 0.58;
  const sunA = -Math.PI / 2 + time * 0.30;
  const sx = cx + Math.cos(sunA) * orbit, sy = cy + Math.sin(sunA) * orbit;
  ctx.fillStyle = COL.teal;
  ctx.beginPath(); ctx.arc(sx, sy, 3.2, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(53,224,208,0.45)';
  ctx.beginPath(); ctx.arc(sx, sy, 6, 0, TAU); ctx.stroke();

  const moonA = sunA + 2.2 + time * 0.045;
  const mx = cx + Math.cos(moonA) * orbit, my = cy + Math.sin(moonA) * orbit;
  const phase = Math.floor(((time * 0.035) % 1) * 32) / 32;
  ctx.save();
  ctx.beginPath(); ctx.arc(mx, my, 4.8, 0, TAU); ctx.clip();
  ctx.fillStyle = '#0a1218';
  ctx.fillRect(mx - 7, my - 7, 14, 14);
  ctx.fillStyle = '#c8dbe4';
  ctx.beginPath(); ctx.arc(mx + (phase - 0.5) * 11.5, my, 4.8, 0, TAU); ctx.fill();
  ctx.restore();
  ctx.strokeStyle = COL.rule;
  ctx.beginPath(); ctx.arc(mx, my, 4.8, 0, TAU); ctx.stroke();

  // the horizon ring, day above and night below
  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(53,224,208,0.16)';
  ctx.beginPath(); ctx.arc(cx, cy, r * 0.74, Math.PI, TAU); ctx.stroke();
  ctx.strokeStyle = 'rgba(120,150,170,0.09)';
  ctx.beginPath(); ctx.arc(cx, cy, r * 0.74, 0, Math.PI); ctx.stroke();

  // the tick ring
  ctx.lineWidth = 1;
  for (let i = 0; i < 60; i++) {
    const a = i / 60 * TAU - Math.PI / 2;
    const big = i % 5 === 0;
    const r0 = r * (big ? 0.83 : 0.86), r1 = r * 0.90;
    ctx.strokeStyle = big ? 'rgba(53,224,208,0.45)' : COL.rule;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
    ctx.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
    ctx.stroke();
  }

  // the scan window, draining the outer dial
  ctx.lineWidth = 4;
  ctx.strokeStyle = COL.rule;
  ctx.beginPath(); ctx.arc(cx, cy, r - 3, 0, TAU); ctx.stroke();
  ctx.strokeStyle = frac < 0.25 ? COL.red : COL.cyan;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(cx, cy, r - 3, -Math.PI / 2, -Math.PI / 2 + Math.max(0.001, frac) * TAU);
  ctx.stroke();
  ctx.lineCap = 'butt';

  // the countdown itself, over the stars
  ctx.textAlign = 'center';
  ctx.fillStyle = frac < 0.25 ? COL.red : COL.text;
  ctx.font = '600 ' + Math.round(r * 0.52) + 'px ui-monospace, Menlo, monospace';
  ctx.fillText(secs.toFixed(1), cx, cy + r * 0.19);

  // and the year, in five digits, outside everything
  ctx.fillStyle = COL.teal;
  ctx.font = Math.round(r * 0.26) + 'px ui-monospace, Menlo, monospace';
  ctx.fillText('0' + year, cx, cy + r + Math.round(r * 0.32));
  ctx.fillStyle = COL.dim;
  ctx.font = Math.round(r * 0.19) + 'px ui-monospace, Menlo, monospace';
  ctx.fillText('LONG NOW YEAR', cx, cy + r + Math.round(r * 0.56));
  ctx.textAlign = 'left';
  ctx.restore();
}

// the three two one before a subject, and the verdict after
function drawBeat(time) {
  if (state !== 'play' || !subject) return;
  const c = L.ch;
  const cy = L.narrow ? L.topH + (H - L.topH) * 0.34 : H * 0.36;
  const k = clamp(Math.min(W, H) / 720, 0.8, 1.4);
  ctx.textAlign = 'center';

  if (subject.phase === 'ready') {
    const left = subject.readyDur - subject.t;
    const n = Math.ceil(left);
    const frac = 1 - (n - left);            // 0 at the tick, 1 just before it
    ctx.globalAlpha = clamp(1 - frac * 0.75, 0, 1);
    ctx.fillStyle = n <= 0 ? COL.teal : COL.cyan;
    ctx.font = '600 ' + Math.round((n <= 0 ? 74 : 110) * k) + 'px ui-monospace, Menlo, monospace';
    ctx.fillText(n <= 0 ? 'GO' : String(n), c.cx, cy);
    ctx.globalAlpha = 1;
  } else if (subject.phase === 'result') {
    // the banner fades fast, Danny's dance is the main event through the
    // rest of this phase, and the countdown to the next round rides on top
    // of him the whole time rather than fading with the banner
    const f = clamp(subject.t / (JACKET_EXIT + 0.6), 0, 1);
    ctx.globalAlpha = clamp(1 - f, 0, 1);
    ctx.fillStyle = banner && banner.ok ? COL.teal : COL.red;
    ctx.font = '600 ' + Math.round(38 * k) + 'px ui-monospace, Menlo, monospace';
    ctx.fillText(banner ? banner.text : '', c.cx, cy);
    ctx.fillStyle = COL.dim;
    ctx.font = Math.round(16 * k) + 'px ui-monospace, Menlo, monospace';
    ctx.fillText(banner ? banner.sub : '', c.cx, cy + 30 * k);
    ctx.globalAlpha = 1;

    const remain = Math.max(0, subject.resultDur - subject.t);
    ctx.fillStyle = COL.dim;
    ctx.font = Math.round(13 * k) + 'px ui-monospace, Menlo, monospace';
    ctx.fillText('NEXT ROUND IN ' + remain.toFixed(1) + 's', c.cx, cy + 56 * k);
  }
  ctx.textAlign = 'left';
}

function drawCursor() {
  const c = L.ch;
  if (pointer.x < c.x || pointer.x > c.x + c.w) return;
  const locked = laser.lock > 0;
  ctx.strokeStyle = locked ? COL.red : (laser.onBody ? COL.cyan : COL.tealDim);
  ctx.lineWidth = 1;
  const r = PULSE_RADIUS;
  ctx.globalAlpha = locked ? 0.5 : 0.75;
  ctx.beginPath(); ctx.arc(pointer.x, pointer.y, r, 0, TAU); ctx.stroke();
  ctx.globalAlpha = 1;
}

// ---------------------------------------------------------------- panels

function label(text, x, y, size) {
  ctx.fillStyle = COL.dim;
  ctx.font = ((size || 11) * L.hud) + 'px ui-monospace, Menlo, monospace';
  ctx.fillText(text, x, y);
}
function value(text, x, y, size, color) {
  ctx.fillStyle = color || COL.text;
  ctx.font = (size * L.hud) + 'px ui-monospace, Menlo, monospace';
  ctx.fillText(text, x, y);
}
function bar(x, y, w, h, frac, color) {
  ctx.fillStyle = '#0d1418';
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w * clamp(frac, 0, 1), h);
  ctx.strokeStyle = COL.rule;
  ctx.lineWidth = 1;
  ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
}
function strikeDots(x, y, r) {
  for (let i = 0; i < MAX_MISSES; i++) {
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = i < misses ? COL.red : COL.rule;
    ctx.fillStyle = COL.red;
    ctx.beginPath(); ctx.arc(x + r + i * (r * 2 + 9), y, r, 0, TAU);
    if (i < misses) ctx.fill();
    ctx.stroke();
  }
}
function heatColor() {
  return laser.lock > 0 ? COL.red : (laser.heat > 75 ? COL.cyan : COL.teal);
}
function scanFrac() {
  const tLeft = subject && subject.phase !== 'ready' ? subject.scanLeft
              : (subject ? subject.scanTime : 0);
  return { tLeft, frac: subject ? clamp(tLeft / subject.scanTime, 0, 1) : 0 };
}

// "Am I supposed to click all the dots, or just the red ones?" is a fair
// question that the title card was answering two minutes too early.
function drawGoal(time) {
  const c = L.ch;
  const sc = scanFrac();
  const k = L.clock;
  if (!L.narrow) drawClock(k.cx, k.cy, k.r, sc.frac, sc.tLeft, time);

  if (state !== 'play' || !subject || subject.phase === 'result') return;
  const y = (L.narrow ? L.topH : k.cy + k.r) + 46;
  ctx.textAlign = 'center';
  const maxW = c.w - 28;
  const left = subject.total - subject.got;
  if (subject.phase === 'ready') {
    fitCentered('RECOVER ALL ' + subject.total + ' IN ' +
                subject.scanTime.toFixed(1) + ' SECONDS', c.cx, y, maxW, 15, COL.cyan);
  } else if (left > 0) {
    fitCentered(left + ' LEFT', c.cx, y, maxW, 16, left <= 3 ? COL.cyan : COL.text);
  } else {
    fitCentered('ALL RECOVERED', c.cx, y, maxW, 16, COL.teal);
  }
  fitCentered(L.narrow ? 'TAP, THEN DRAG THEM TO THE INTAKE'
                       : 'TAP TO KNOCK THEM OFF, THEN HOLD AND DRAG TO THE INTAKE',
              c.cx, y + 22, maxW, 12, COL.dim);
  ctx.textAlign = 'left';
}

function drawPanels(time) {
  if (L.narrow) { drawBars(time); return; }

  const lp = L.left, rp = L.right;
  ctx.fillStyle = COL.panel;
  ctx.fillRect(0, 0, lp.w, H);
  ctx.fillRect(rp.x, 0, rp.w, H);
  ctx.strokeStyle = COL.rule;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(lp.w + .5, 0); ctx.lineTo(lp.w + .5, H);
  ctx.moveTo(rp.x + .5, 0); ctx.lineTo(rp.x + .5, H);
  ctx.stroke();

  const x = 20, bw = lp.w - 40;
  let y = 40;
  ctx.textAlign = 'left';
  label('PARTICLE RECOVERY UNIT 04', x, y, 11); y += 30;

  label('SCORE', x, y); y += 32;
  value(String(score).padStart(6, '0'), x, y, 31, COL.text); y += 36;

  label('ROUND', x, y); y += 27;
  value(String(round).padStart(2, '0'), x, y, 22, COL.text); y += 34;

  label('EMITTER HEAT', x, y); y += 15;
  bar(x, y, bw, 10, laser.heat / 100, heatColor());
  y += 26;
  if (laser.lock > 0) value('OVERHEAT. COOLING.', x, y, 13, COL.red);
  y += 24;

  label('SCAN WINDOW', x, y); y += 26;
  const sc = scanFrac();
  value(sc.tLeft.toFixed(1) + ' s', x, y, 20, sc.frac < 0.25 ? COL.red : COL.text);
  y += 40;

  label('FLAGGED LOST', x, y); y += 24;
  strikeDots(x, y, 9);
  y += 42;

  label('SUBJECT', x, y); y += 24;
  value(subject && state === 'play' ? subject.id : 'STANDBY', x, y, 17, COL.text);

  // ---- right panel, the analysis feed
  const rx = rp.x + 20;
  let ry = 40;
  value('ANALYSIS FEED', rx, ry, 16, COL.teal); ry += 19;
  label('CAPTURE MECHANISM 1', rx, ry, 11); ry += 28;
  ctx.strokeStyle = COL.rule;
  ctx.beginPath(); ctx.moveTo(rx, ry - 11); ctx.lineTo(W - 20, ry - 11); ctx.stroke();
  ry += 8;

  if (feed.length === 0) label('AWAITING SAMPLE', rx, ry);
  for (const f of feed) {
    if (ry > H - 140) break;
    ctx.globalAlpha = clamp(1 - (f.age - 8) / 6, 0.3, 1);
    if (f.warn || f.ok) {
      const col = f.warn ? COL.red : COL.teal;
      ctx.fillStyle = col;
      ctx.fillRect(rx, ry - 10, 8, 8);
      value(f.text, rx + 18, ry, 14, col);
    } else {
      ctx.fillStyle = f.type.color;
      ctx.beginPath(); ctx.arc(rx + 4, ry - 5, 4.5, 0, TAU); ctx.fill();
      value(f.type.name, rx + 18, ry, 14, f.type.flagged ? COL.red : COL.text);
      if (f.n > 1) {
        ctx.textAlign = 'right';
        value('x' + f.n, W - 20, ry, 14, COL.dim);
        ctx.textAlign = 'left';
      }
      if (f.type.flagged) { ry += 17; value('FLAGGED FOR ANALYSIS', rx + 18, ry, 11.5, COL.red); }
    }
    ry += 28;
    ctx.globalAlpha = 1;
  }

  const fy = H - 108;
  ctx.strokeStyle = COL.rule;
  ctx.beginPath(); ctx.moveTo(rx, fy - 22); ctx.lineTo(W - 20, fy - 22); ctx.stroke();
  const rate = released > 0 ? Math.round(captured / released * 100) : 0;
  const rows = [
    ['DISLODGED', String(released), COL.text],
    ['CAPTURED', String(captured), COL.text],
    ['RECOVERY', rate + ' %', rate >= 60 ? COL.teal : COL.cyan],
  ];
  rows.forEach((r, i) => {
    label(r[0], rx, fy + i * 26);
    ctx.textAlign = 'right'; value(r[1], W - 20, fy + i * 26, 15, r[2]); ctx.textAlign = 'left';
  });
}

// phone layout: two bars laid over the chamber, nothing smaller than 12px
function drawBars(time) {
  const pad = 15;
  ctx.fillStyle = 'rgba(6,10,13,0.90)';
  ctx.fillRect(0, 0, W, L.topH);
  ctx.strokeStyle = COL.rule;
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, L.topH + .5); ctx.lineTo(W, L.topH + .5); ctx.stroke();

  ctx.textAlign = 'left';
  label('SCORE', pad, 26, 12);
  value(String(score).padStart(6, '0'), pad, 58, 27, COL.text);

  const sc = scanFrac();
  const k = L.clock;
  drawClock(k.cx, k.cy, k.r, sc.frac, sc.tLeft, time);

  ctx.textAlign = 'right';
  label('ROUND ' + String(round).padStart(2, '0'), W - pad, 26, 12);
  ctx.textAlign = 'left';
  strikeDots(W - pad - 58, 50, 8);

  // the heat bar sits on its own row with the label beside it, not over it
  const hy = L.topH - 20;
  label(laser.lock > 0 ? 'COOLING' : 'HEAT', pad, hy + 9, 12);
  bar(pad + 60, hy, W - pad - 60 - pad, 10, laser.heat / 100, heatColor());

  // bottom bar: what the analyser last saw, and how much you are keeping
  const by = H - L.botH;
  ctx.fillStyle = 'rgba(6,10,13,0.90)';
  ctx.fillRect(0, by, W, L.botH);
  ctx.strokeStyle = COL.rule;
  ctx.beginPath(); ctx.moveTo(0, by + .5); ctx.lineTo(W, by + .5); ctx.stroke();

  if (subject && state === 'play') {
    ctx.textAlign = 'center';
    value('SUBJECT ' + subject.id, W / 2, by + 24, 12, COL.dim);
    ctx.textAlign = 'left';
  }

  const top = feed[0];
  label('ANALYSIS', pad, by + 40, 12);
  if (!top) {
    value('AWAITING SAMPLE', pad, by + 58, 14, COL.dim);
  } else if (top.warn || top.ok) {
    value(top.text, pad, by + 58, 14, top.warn ? COL.red : COL.teal);
  } else {
    ctx.fillStyle = top.type.color;
    ctx.beginPath(); ctx.arc(pad + 5, by + 53, 5, 0, TAU); ctx.fill();
    value(top.type.name + (top.n > 1 ? ' x' + top.n : ''), pad + 19, by + 58, 14,
          top.type.flagged ? COL.red : COL.text);
  }
  const rate = released > 0 ? Math.round(captured / released * 100) : 0;
  ctx.textAlign = 'right';
  label('RECOVERY', W - pad, by + 40, 12);
  value(rate + ' %', W - pad, by + 58, 18, rate >= 60 ? COL.teal : COL.cyan);
  ctx.textAlign = 'left';
}

const OVERLAY = 'rgba(4,7,10,0.975)';

// Measure before drawing. A centred string that does not fit gets shrunk, down
// to a floor of 12px, below which it is not worth reading.
function fitCentered(text, cx, y, maxW, size, color) {
  const mono = 'px ui-monospace, Menlo, monospace';
  let f = size * L.hud;
  ctx.font = f + mono;
  const w = ctx.measureText(text).width;
  if (w > maxW) { f = Math.max(12, f * maxW / w); ctx.font = f + mono; }
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.fillText(text, cx, y);
  ctx.textAlign = 'left';
  return f;
}

function wrapToWidth(text, maxW, font) {
  ctx.font = font;
  const words = text.split(' ');
  const out = [];
  let line = '';
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && line) { out.push(line); line = w; }
    else { line = t; }
  }
  if (line) out.push(line);
  return out;
}

function card(title, titleColor, sub, lines, button, accent) {
  const c = L.ch;
  ctx.fillStyle = OVERLAY;
  ctx.fillRect(c.x, 0, c.w, H);
  ctx.textAlign = 'center';

  const k = clamp(Math.min(W, H) / 720, 0.82, 1.35);
  const mono = 'px ui-monospace, Menlo, monospace';
  const maxW = c.w - 36;
  const put = (t, y, size, color, weight) => {
    ctx.fillStyle = color;
    ctx.font = (weight ? weight + ' ' : '') + (size * k) + mono;
    ctx.fillText(t, c.cx, y);
  };

  // wrap first, so the block height knows how tall it really is
  const bodyFont = (14 * k) + mono;
  const wrapped = [];
  for (const t of lines) for (const w of wrapToWidth(t, maxW, bodyFont)) wrapped.push(w);

  const bw = Math.min(c.w * 0.72, 280 * k), bh = 56 * k;
  const block = 46 * k + 26 * k + bh + 44 * k + wrapped.length * 24 * k;
  // the title screen carries the spectrum panel below it, so it sits high
  // rather than centred
  let y = (title === 'DUST OFF' ? 34 * k : Math.max(40 * k, (H - block) / 2)) + 34 * k;

  const tSize = Math.min(44, (maxW / Math.max(6, title.length)) * 1.55);
  put(title, y, tSize, titleColor, '600'); y += 24 * k;
  for (const sl of wrapToWidth(sub, maxW, (13 * k) + mono)) {
    put(sl, y, 13, COL.dim); y += 19 * k;
  }
  y += 12 * k;

  const bx = c.cx - bw / 2;
  const pulse = 0.6 + 0.4 * Math.sin(performance.now() / 420);
  ctx.fillStyle = 'rgba(126,224,255,' + (0.08 + pulse * 0.07) + ')';
  ctx.fillRect(bx, y, bw, bh);
  ctx.strokeStyle = accent;
  ctx.lineWidth = 2;
  ctx.strokeRect(bx + 1, y + 1, bw - 2, bh - 2);
  ctx.textAlign = 'center';
  put(button, y + bh / 2 + 7 * k, 19, accent, '700');
  y += bh + 40 * k;

  for (const t of wrapped) { put(t, y, 14, COL.dim); y += 24 * k; }
  ctx.textAlign = 'left';
}

function drawTitle() {
  card('DUST OFF', COL.teal,
    'Radiofrequency particle separator, except up the spectrum bc we are using light beams.',
    ['Sweep every particle into the intake before the clock runs out.'],
    'PLAY NOW', COL.teal);
}

function drawOver() {
  const rate = released > 0 ? Math.round(captured / released * 100) : 0;
  card('SHIFT ENDED', COL.red, 'THREE ROUNDS MISSED', [
    'Score ' + String(score).padStart(6, '0'),
    'Round ' + round + ', ' + rate + ' per cent recovered overall',
    'Long now year 0' + year,
  ], 'RUN IT AGAIN', COL.teal);
}

// ---------------------------------------------------------------- loop

let last = performance.now();
function step(now) {
  if (document.body.dataset.state !== state) document.body.dataset.state = state;
  // requestAnimationFrame's own timestamp and the setInterval fallback below
  // can race, so a callback queued against an older frame time can still run
  // after the interval already moved `last` forward, making now < last. A
  // one-shot animation reading a negative dt at time 0 reads as "reached the
  // start while playing backwards" to three.js and ends immediately, so
  // never a negative dt out of here.
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000));
  last = now;
  update(dt);
  draw(now / 1000);
}
function frame(now) { step(now); requestAnimationFrame(frame); }
// Some embedded webviews throttle requestAnimationFrame to nothing. If frames
// stop arriving, keep the loop alive on a timer.
setInterval(() => { if (performance.now() - last > 40) step(performance.now()); }, 16);

layout();
subject = null;
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
